+## What's Changed\n+\n+- fix(editor): stop setState-during-render loop in multi-message annotate by @backnotprop in [#950](https://github.com/backnotprop/plannotator/pull/950)\n+\n+## Community\n+\n+Thanks to @emmaneugene, who reported the blank-page regression in [#949](https://github.com/backnotprop/plannotator/issues/949), traced it to the exact render-path state write, and supplied the fix that this release ships.\n+\n+**Full Changelog**: https://github.com/backnotprop/plannotator/compare/v0.21.0...v0.21.1\ndiff --git a/RELEASE_NOTES_v0.21.2.md b/RELEASE_NOTES_v0.21.2.md\nnew file mode 100644\nindex 00000000..11327b36\n--- /dev/null\n+++ b/RELEASE_NOTES_v0.21.2.md\n@@ -0,0 +1,150 @@\n+Follow [@plannotator](https://x.com/plannotator) on X for updates\n+\n+\u003cdetails\u003e\n+\u003csummary\u003e\u003cstrong\u003eMissed recent releases?\u003c/strong\u003e\u003c/summary\u003e\n+\n+| Release                                                                      | Highlights                                                                                                                       |\n+| ---------------------------------------------------------------------------- | -------------------------------------------------------------------------------------------------------------------------------- |\n+| [v0.21.1](https://github.com/backnotprop/plannotator/releases/tag/v0.21.1)   | Annotate-last blank-page fix on multi-message sessions                                                                            |\n+| [v0.21.0](https://github.com/backnotprop/plannotator/releases/tag/v0.21.0)   | Direct document editing in annotate mode, live git-status file tree, in-app agent terminal, open files in external apps, HTML renders as HTML |\n+| [v0.20.3](https://github.com/backnotprop/plannotator/releases/tag/v0.20.3)   | Annotations no longer lost when clicking away, off-screen indicator for open comments                                            |\n+| [v0.20.2](https://github.com/backnotprop/plannotator/releases/tag/v0.20.2)   | Pierre CodeView all-files review, large-PR pipeline and instant-open checkout, unified agent engine selection, Pi programmatic plan mode |\n+| [v0.20.1](https://github.com/backnotprop/plannotator/releases/tag/v0.20.1)   | Pi extension install hotfix (pinned `@pierre/diffs` after a broken upstream release)                                             |\n+| [v0.20.0](https://github.com/backnotprop/plannotator/releases/tag/v0.20.0)   | Multi-repo workspace reviews, semantic diff overview, UI 2.0 themes and plan look chooser, leaner single-source skill install   |\n+| [v0.19.27](https://github.com/backnotprop/plannotator/releases/tag/v0.19.27) | Kiro CLI integration, Glimpse native window, annotate-last message picker                                                        |\n+| [v0.19.26](https://github.com/backnotprop/plannotator/releases/tag/v0.19.26) | Amp plugin production fixes, Mermaid rendering fix, Settings flicker fix, update notification toast and shimmer                   |\n+| [v0.19.24](https://github.com/backnotprop/plannotator/releases/tag/v0.19.24) | Amp integration, configurable data directory, Auto Mode permission option, Pi plan approval fix                                  |\n+| [v0.19.23](https://github.com/backnotprop/plannotator/releases/tag/v0.19.23) | Droid integration, Windows Pi AI fix, quieter update indicator                                                                   |\n+| [v0.19.22](https://github.com/backnotprop/plannotator/releases/tag/v0.19.22) | Safari copy fix in plan viewer, CLAUDE_CONFIG_DIR support for session logs                                                       |\n+\n+\u003c/details\u003e\n+\n+---\n+\n+## What's New in v0.21.2\n+\n+Six PRs land in this release, with most of the work going into code review. You can now run your own Agent Skills as review profiles, and the review engine picker gains two new options — Cursor and OpenCode — alongside the existing Claude and Codex paths. A draft-persistence bug that resurrected deleted annotations is fixed, and Codex users get two improvements from a first-time contributor.\n+\n+### Custom Reviews as Agent Skills\n+\n+Until now the code review engine ran a fixed review prompt. This release lets you point a review at any Agent Skill you already have installed. Enable a skill as a review profile and the agent runs that skill's instructions against your diff instead of the built-in prompt, so a security skill, a style-guide skill, or any review methodology you've written becomes a one-click review.\n+\n+Findings also gained two new shapes. A review can now attach a finding to an entire file rather than a specific line, and it can raise a general finding that applies to the whole changeset instead of any single location. Whole-file and general findings render in their own sections and flow through to the exported feedback the agent receives, so nothing a reviewer raises gets dropped because it didn't map to a line.\n+\n+PR [#955](https://github.com/backnotprop/plannotator/pull/955), by @backnotprop.\n+\n+### Cursor and OpenCode Review Engines\n+\n+The review engine selection now includes Cursor and OpenCode in addition to Claude and Codex. Both run through a unified \"marker\" protocol: the agent runs its own CLI (`agent` for Cursor, `opencode run` for OpenCode) against your changes and returns findings in a delimited block that Plannotator parses back into annotations. The engines are opt-in and only appear when their CLI is installed, and they share the same finding pipeline as the existing engines, so whole-file and general findings work across all four.\n+\n+PR [#959](https://github.com/backnotprop/plannotator/pull/959), by @backnotprop.\n+\n+### Deleted Review Annotations Stay Deleted\n+\n+In code review, deleting an annotation and then refreshing the page brought it back. The draft autosave kept the last saved copy, and a deletion wasn't being persisted as a real edit, so the next load restored the annotation the user had removed. This release records deletions with a generation tombstone so they survive a refresh and a late autosave can't revive them, while leaving genuine drafts intact.\n+\n+PR [#951](https://github.com/backnotprop/plannotator/pull/951) closing [#948](https://github.com/backnotprop/plannotator/issues/948), reported by @alexanderkreidich.\n+\n+### Codex Ask AI Outside Git Repos\n+\n+Ask AI on the Codex provider assumed it was running inside a git repository and failed when it wasn't. It now probes for a working tree and skips the git-repo check when there isn't one, so Ask AI works in plain directories that aren't under version control.\n+\n+PR [#965](https://github.com/backnotprop/plannotator/pull/965), by @ericclemmons.\n+\n+### Codex Desktop Review URL Surfacing\n+\n+When Plannotator runs inside the Codex desktop app, the session URL wasn't easy to find. It now prints the review URL to the terminal when it detects the Codex desktop host, so the link is visible instead of buried.\n+\n+PR [#966](https://github.com/backnotprop/plannotator/pull/966), by @ericclemmons.\n+\n+### Additional Changes\n+\n+- **Landing page section order** — the capabilities section now sits above the demos on the marketing site. PR [#953](https://github.com/backnotprop/plannotator/pull/953), by @backnotprop.\n+\n+## Install / Update\n+\n+**macOS / Linux:**\n+\n+```bash\n+curl -fsSL https://plannotator.ai/install.sh | bash\n+```\n+\n+**Windows:**\n+\n+```powershell\n+irm https://plannotator.ai/install.ps1 | iex\n+```\n+\n+**Extra skills** (compound, setup-goal, visual-explainer), opt-in:\n+\n+```bash\n+npx skills add backnotprop/plannotator/apps/skills/extra\n+```\n+\n+**Claude Code Plugin:** Run `/plugin` in Claude Code, find **plannotator**, and click **\"Update now\"**.\n+\n+**OpenCode:** Clear cache and restart:\n+\n+```bash\n+rm -rf ~/.bun/install/cache/@plannotator\n+```\n+\n+Then in `opencode.json`:\n+\n+```json\n+{\n+  \"plugin\": [\"@plannotator/opencode@latest\"]\n+}\n+```\n+\n+**Pi:** Install or update the extension:\n+\n+```bash\n+pi install npm:@plannotator/pi-extension\n+```\n+\n+**Droid:** Install via the plugin marketplace:\n+\n+```\n+droid plugin marketplace add backnotprop/plannotator\n+droid plugin install plannotator@plannotator\n+```\n+\n+**Amp:** Install the CLI first, then copy the plugin:\n+\n+```bash\n+mkdir -p ~/.config/amp/plugins\n+curl -fsSL https://raw.githubusercontent.com/backnotprop/plannotator/main/apps/amp-plugin/plannotator.ts \\\n+  -o ~/.config/amp/plugins/plannotator.ts\n+```\n+\n+**Kiro CLI:** The installer auto-detects Kiro and installs skills automatically. After installing the CLI, launch with:\n+\n+```bash\n+kiro-cli chat --agent plannotator\n+```\n+\n+Upgrading from before v0.20.0? Read the [v0.20.0 release notes](https://github.com/backnotprop/plannotator/releases/tag/v0.20.0) first; that release changed how skills install.\n+\n+---\n+\n+## What's Changed\n+\n+- fix(review): persist annotation deletions so they don't resurrect on refresh by @backnotprop in [#951](https://github.com/backnotprop/plannotator/pull/951)\n+- feat(marketing): restructure landing page section order by @backnotprop in [#953](https://github.com/backnotprop/plannotator/pull/953)\n+- feat(review): custom reviews as Agent Skills + whole-file/general findings by @backnotprop in [#955](https://github.com/backnotprop/plannotator/pull/955)\n+- feat(review): Cursor + OpenCode review engines (unified marker-review) by @backnotprop in [#959](https://github.com/backnotprop/plannotator/pull/959)\n+- Allow Codex Ask AI outside git repos by @ericclemmons in [#965](https://github.com/backnotprop/plannotator/pull/965)\n+- Improve Codex App review URL discoverability by @ericclemmons in [#966](https://github.com/backnotprop/plannotator/pull/966)\n+\n+## New Contributors\n+\n+- @ericclemmons made their first contribution in [#965](https://github.com/backnotprop/plannotator/pull/965)\n+\n+## Contributors\n+\n+@ericclemmons landed two Codex improvements in his first contributions to the project: making Ask AI work outside git repositories in [#965](https://github.com/backnotprop/plannotator/pull/965), and surfacing the review URL when running inside the Codex desktop app in [#966](https://github.com/backnotprop/plannotator/pull/966).\n+\n+Thanks to @alexanderkreidich, who reported in [#948](https://github.com/backnotprop/plannotator/issues/948) that deleted review annotations reappeared after a refresh — the bug this release fixes.\n+\n+**Full Changelog**: https://github.com/backnotprop/plannotator/compare/v0.21.1...v0.21.2\ndiff --git a/RELEASE_NOTES_v0.21.3.md b/RELEASE_NOTES_v0.21.3.md\nnew file mode 100644\nindex 00000000..8135af05\n--- /dev/null\n+++ b/RELEASE_NOTES_v0.21.3.md\n@@ -0,0 +1,160 @@\n+Follow [@plannotator](https://x.com/plannotator) on X for updates\n+\n+\u003cdetails\u003e\n+\u003csummary\u003e\u003cstrong\u003eMissed recent releases?\u003c/strong\u003e\u003c/summary\u003e\n+\n+| Release                                                                      | Highlights                                                                                                                       |\n+| ---------------------------------------------------------------------------- | -------------------------------------------------------------------------------------------------------------------------------- |\n+| [v0.21.2](https://github.com/backnotprop/plannotator/releases/tag/v0.21.2)   | Custom reviews as Agent Skills, Cursor + OpenCode review engines, whole-file/general findings, deleted-annotation fix, Codex Ask AI outside git repos |\n+| [v0.21.1](https://github.com/backnotprop/plannotator/releases/tag/v0.21.1)   | Annotate-last blank-page fix on multi-message sessions                                                                            |\n+| [v0.21.0](https://github.com/backnotprop/plannotator/releases/tag/v0.21.0)   | Direct document editing in annotate mode, live git-status file tree, in-app agent terminal, open files in external apps, HTML renders as HTML |\n+| [v0.20.3](https://github.com/backnotprop/plannotator/releases/tag/v0.20.3)   | Annotations no longer lost when clicking away, off-screen indicator for open comments                                            |\n+| [v0.20.2](https://github.com/backnotprop/plannotator/releases/tag/v0.20.2)   | Pierre CodeView all-files review, large-PR pipeline and instant-open checkout, unified agent engine selection, Pi programmatic plan mode |\n+| [v0.20.1](https://github.com/backnotprop/plannotator/releases/tag/v0.20.1)   | Pi extension install hotfix (pinned `@pierre/diffs` after a broken upstream release)                                             |\n+| [v0.20.0](https://github.com/backnotprop/plannotator/releases/tag/v0.20.0)   | Multi-repo workspace reviews, semantic diff overview, UI 2.0 themes and plan look chooser, leaner single-source skill install   |\n+| [v0.19.27](https://github.com/backnotprop/plannotator/releases/tag/v0.19.27) | Kiro CLI integration, Glimpse native window, annotate-last message picker                                                        |\n+| [v0.19.26](https://github.com/backnotprop/plannotator/releases/tag/v0.19.26) | Amp plugin production fixes, Mermaid rendering fix, Settings flicker fix, update notification toast and shimmer                   |\n+| [v0.19.24](https://github.com/backnotprop/plannotator/releases/tag/v0.19.24) | Amp integration, configurable data directory, Auto Mode permission option, Pi plan approval fix                                  |\n+| [v0.19.23](https://github.com/backnotprop/plannotator/releases/tag/v0.19.23) | Droid integration, Windows Pi AI fix, quieter update indicator                                                                   |\n+\n+\u003c/details\u003e\n+\n+---\n+\n+## What's New in v0.21.3\n+\n+A follow-up to the code-review work in v0.21.2. The headline is file-scoped comments in code review with a reworked comment experience, and the rest of the release is fixes and polish: a new contributor fixed clipboard and keyboard handling in the VS Code extension, the CLI now prints help for its subcommands, Codex Ask AI moved onto a more reliable transport, and the Ask AI sidebar got a few rough edges sanded down. Eight changes land in total, including a first contribution from @rushelex.\n+\n+### File Comments in Code Review\n+\n+Until now a code-review comment always attached to a line range. This release adds file-scoped comments — a comment that belongs to a whole file rather than any single line. In the single-file view it renders as a full-text banner directly below the file path; in the all-files view it sits in the file header for expanded files. Guided reviews that produce file-level findings now anchor them where they belong instead of forcing them onto a line.\n+\n+The comment experience was also unified. Clicking a comment — whether the inline card in the diff, the sidebar entry, or the file banner — replays its stored line range as a controlled highlight, and clicking it again clears the highlight. Scrolling the viewport to a comment is reserved for the sidebar and findings list, so clicking a comment inside the diff highlights it without yanking the page around. The inline, sidebar, and file-banner cards now share a single identity row (badges, author, timestamp), a single action row (edit, copy, delete), and a consistent file-name chip, replacing three separately built layouts that had drifted apart.\n+\n+PR [#973](https://github.com/backnotprop/plannotator/pull/973), by @backnotprop.\n+\n+### VS Code Clipboard and Keyboard Handling\n+\n+The VS Code extension renders Plannotator inside a webview, and two long-standing problems made that webview feel second-class. Copy and paste didn't work — clipboard content never crossed the webview boundary — and standard VS Code keybindings like Cmd+P stopped responding while a Plannotator tab was focused. This release bridges the clipboard so copy, cut, and paste work inside the webview, and forwards keystrokes to VS Code so its keybindings resolve as expected.\n+\n+PR [#970](https://github.com/backnotprop/plannotator/pull/970) closing [#864](https://github.com/backnotprop/plannotator/issues/864) and [#969](https://github.com/backnotprop/plannotator/issues/969), by @rushelex — who both reported the bugs and contributed the fix.\n+\n+### Codex Ask AI on the App-Server Transport\n+\n+Codex Ask AI no longer drives `codex exec` through the `@openai/codex-sdk` package. It now runs a long-lived `codex app-server` process over JSON-RPC, which respects the user's and enterprise-managed approval policy and supports interactive Allow/Deny approvals surfaced as cards in the UI. The provider id stays `codex-sdk` so existing saved preferences keep working. A startup edge case is also fixed: if the app-server process spawned but stalled on its initialize handshake, it was left running and every later question hung until an idle timer reaped it. The process is now killed on a failed handshake, so the next question starts cleanly.\n+\n+PR [#971](https://github.com/backnotprop/plannotator/pull/971), by @backnotprop.\n+\n+### CLI Subcommand Help\n+\n+Running `plannotator review --help` (and the same for other subcommands) launched the review UI instead of printing help text. The CLI now resolves `--help` and `-h` for each subcommand before dispatching, so the help flag prints usage and exits without starting a server.\n+\n+PR [#974](https://github.com/backnotprop/plannotator/pull/974) closing [#964](https://github.com/backnotprop/plannotator/issues/964), reported by @rrei.\n+\n+### Clickable Ask AI Announcement Cards\n+\n+The first time Ask AI appears, an announcement dialog presents the available providers as cards. Those cards were missing their click handler, so selecting a provider from the announcement did nothing. They are clickable now and select the provider as expected.\n+\n+PR [#975](https://github.com/backnotprop/plannotator/pull/975) closing [#972](https://github.com/backnotprop/plannotator/issues/972), reported by @Duo-Huang.\n+\n+### Ask AI Sidebar Polish\n+\n+Two smaller fixes in the code-review Ask AI sidebar. The per-file chat groups used to start collapsed, so every file you had asked about had to be opened by hand; they now default to expanded, while manual collapse still works and persists. And clicking a sidebar comment that no longer matches the active PR or diff scope — for example after switching PRs in place — used to do nothing at all; it now clears the current selection so the click gives visible feedback instead of appearing broken.\n+\n+### Additional Changes\n+\n+- **Dependency maintenance** — GitHub Actions used by the build and release workflows were updated (`actions/checkout` to v7, `softprops/action-gh-release` to v3, and others). PR [#791](https://github.com/backnotprop/plannotator/pull/791), by @renovate.\n+\n+## Install / Update\n+\n+**macOS / Linux:**\n+\n+```bash\n+curl -fsSL https://plannotator.ai/install.sh | bash\n+```\n+\n+**Windows:**\n+\n+```powershell\n+irm https://plannotator.ai/install.ps1 | iex\n+```\n+\n+**Extra skills** (compound, setup-goal, visual-explainer), opt-in:\n+\n+```bash\n+npx skills add backnotprop/plannotator/apps/skills/extra\n+```\n+\n+**Claude Code Plugin:** Run `/plugin` in Claude Code, find **plannotator**, and click **\"Update now\"**.\n+\n+**OpenCode:** Clear cache and restart:\n+\n+```bash\n+rm -rf ~/.bun/install/cache/@plannotator\n+```\n+\n+Then in `opencode.json`:\n+\n+```json\n+{\n+  \"plugin\": [\"@plannotator/opencode@latest\"]\n+}\n+```\n+\n+**Pi:** Install or update the extension:\n+\n+```bash\n+pi install npm:@plannotator/pi-extension\n+```\n+\n+**Droid:** Install via the plugin marketplace:\n+\n+```\n+droid plugin marketplace add backnotprop/plannotator\n+droid plugin install plannotator@plannotator\n+```\n+\n+**Amp:** Install the CLI first, then copy the plugin:\n+\n+```bash\n+mkdir -p ~/.config/amp/plugins\n+curl -fsSL https://raw.githubusercontent.com/backnotprop/plannotator/main/apps/amp-plugin/plannotator.ts \\\n+  -o ~/.config/amp/plugins/plannotator.ts\n+```\n+\n+**Kiro CLI:** The installer auto-detects Kiro and installs skills automatically. After installing the CLI, launch with:\n+\n+```bash\n+kiro-cli chat --agent plannotator\n+```\n+\n+Upgrading from before v0.20.0? Read the [v0.20.0 release notes](https://github.com/backnotprop/plannotator/releases/tag/v0.20.0) first; that release changed how skills install.\n+\n+---\n+\n+## What's Changed\n+\n+- feat(review): file comments in the diff + unified click-to-highlight comment UX by @backnotprop in [#973](https://github.com/backnotprop/plannotator/pull/973)\n+- fix(vscode): bridge clipboard and forward keystrokes in webview by @rushelex in [#970](https://github.com/backnotprop/plannotator/pull/970)\n+- fix(annotate): make Ask AI announcement provider cards clickable by @backnotprop in [#975](https://github.com/backnotprop/plannotator/pull/975)\n+- fix(cli): print per-subcommand help instead of launching the UI by @backnotprop in [#974](https://github.com/backnotprop/plannotator/pull/974)\n+- fix(ai): drive Codex Ask AI via codex app-server by @backnotprop in [#971](https://github.com/backnotprop/plannotator/pull/971)\n+- fix(ai): kill codex app-server if the initialize handshake fails by @backnotprop\n+- fix(review): default Ask AI per-file chat groups to expanded by @backnotprop\n+- fix(review): clear selection on out-of-scope sidebar annotation click by @backnotprop\n+- chore(deps): update github actions by @renovate in [#791](https://github.com/backnotprop/plannotator/pull/791)\n+\n+## New Contributors\n+\n+- @rushelex made their first contribution in [#970](https://github.com/backnotprop/plannotator/pull/970)\n+\n+## Contributors\n+\n+@rushelex landed their first contribution, and a complete one: they reported that the VS Code extension couldn't paste from the clipboard ([#864](https://github.com/backnotprop/plannotator/issues/864)) and that VS Code keybindings stopped working while a Plannotator tab was focused ([#969](https://github.com/backnotprop/plannotator/issues/969)), then fixed both in [#970](https://github.com/backnotprop/plannotator/pull/970).\n+\n+Thanks also to the people who reported the bugs this release fixes:\n+\n+- @rrei reported that `plannotator review --help` launched the UI instead of printing help ([#964](https://github.com/backnotprop/plannotator/issues/964)), fixed in [#974](https://github.com/backnotprop/plannotator/pull/974).\n+- @Duo-Huang reported that the Ask AI announcement provider cards were not clickable ([#972](https://github.com/backnotprop/plannotator/issues/972)), fixed in [#975](https://github.com/backnotprop/plannotator/pull/975).\n+\n+**Full Changelog**: https://github.com/backnotprop/plannotator/compare/v0.21.2...v0.21.3\ndiff --git a/RELEASE_NOTES_v0.21.4.md b/RELEASE_NOTES_v0.21.4.md\nnew file mode 100644\nindex 00000000..13856a0d\n--- /dev/null\n+++ b/RELEASE_NOTES_v0.21.4.md\n@@ -0,0 +1,143 @@\n+Follow [@plannotator](https://x.com/plannotator) on X for updates\n+\n+\u003cdetails\u003e\n+\u003csummary\u003e\u003cstrong\u003eMissed recent releases?\u003c/strong\u003e\u003c/summary\u003e\n+\n+| Release                                                                      | Highlights                                                                                                                       |\n+| ---------------------------------------------------------------------------- | -------------------------------------------------------------------------------------------------------------------------------- |\n+| [v0.21.3](https://github.com/backnotprop/plannotator/releases/tag/v0.21.3)   | File comments in code review, unified click-to-highlight comments, VS Code clipboard/keyboard bridge, Codex Ask AI on app-server transport, CLI subcommand help |\n+| [v0.21.2](https://github.com/backnotprop/plannotator/releases/tag/v0.21.2)   | Custom reviews as Agent Skills, Cursor + OpenCode review engines, whole-file/general findings, deleted-annotation fix, Codex Ask AI outside git repos |\n+| [v0.21.1](https://github.com/backnotprop/plannotator/releases/tag/v0.21.1)   | Annotate-last blank-page fix on multi-message sessions                                                                            |\n+| [v0.21.0](https://github.com/backnotprop/plannotator/releases/tag/v0.21.0)   | Direct document editing in annotate mode, live git-status file tree, in-app agent terminal, open files in external apps, HTML renders as HTML |\n+| [v0.20.3](https://github.com/backnotprop/plannotator/releases/tag/v0.20.3)   | Annotations no longer lost when clicking away, off-screen indicator for open comments                                            |\n+| [v0.20.2](https://github.com/backnotprop/plannotator/releases/tag/v0.20.2)   | Pierre CodeView all-files review, large-PR pipeline and instant-open checkout, unified agent engine selection, Pi programmatic plan mode |\n+| [v0.20.1](https://github.com/backnotprop/plannotator/releases/tag/v0.20.1)   | Pi extension install hotfix (pinned `@pierre/diffs` after a broken upstream release)                                             |\n+| [v0.20.0](https://github.com/backnotprop/plannotator/releases/tag/v0.20.0)   | Multi-repo workspace reviews, semantic diff overview, UI 2.0 themes and plan look chooser, leaner single-source skill install   |\n+| [v0.19.27](https://github.com/backnotprop/plannotator/releases/tag/v0.19.27) | Kiro CLI integration, Glimpse native window, annotate-last message picker                                                        |\n+| [v0.19.26](https://github.com/backnotprop/plannotator/releases/tag/v0.19.26) | Amp plugin production fixes, Mermaid rendering fix, Settings flicker fix, update notification toast and shimmer                   |\n+| [v0.19.24](https://github.com/backnotprop/plannotator/releases/tag/v0.19.24) | Amp integration, configurable data directory, Auto Mode permission option, Pi plan approval fix                                  |\n+\n+\u003c/details\u003e\n+\n+---\n+\n+## What's New in v0.21.4\n+\n+This release adds Markdown math rendering and continues the code-review pass from v0.21.2 and v0.21.3. The PR review experience is consolidated into a single Overview panel where the description and individual comments are now annotatable, and the \"Copy agent instructions\" onboarding reaches code review at parity with plan mode. Five PRs land, including one from returning contributor @ishowman.\n+\n+### Markdown Math Rendering\n+\n+Plans, annotated documents, and PR content now render LaTeX math. Inline math written as `$…$` or `\\(…\\)` and display math written as `$$…$$` or `\\[…\\]` typeset through KaTeX, with the fonts bundled into the app so equations render offline. Rendered formulas are also first-class annotation targets: you can drag-select across prose and a formula together, or redline a whole equation, and the selection is captured like any other annotation.\n+\n+Because the same renderer handles arbitrary plan text and untrusted PR descriptions, it is deliberate about what counts as math. A stray or unterminated `$$` (or an informal amount like `$$100k`) no longer runs on and swallows the rest of a document — an unclosed delimiter is treated as ordinary text, so headings and paragraphs below it keep their structure and stay annotatable. Dollar amounts in prose such as `$5-$10`, `$50,000-$100,000`, or `$5/mo … $10/mo` are left as literal text rather than being mistaken for inline math.\n+\n+PR [#878](https://github.com/backnotprop/plannotator/pull/878) closing [#831](https://github.com/backnotprop/plannotator/issues/831), by @ishowman — requested by @XxxXMil.\n+\n+### PR Overview Panel\n+\n+Reviewing a pull request used to mean three separate dock tabs — Summary, Comments, and Checks — behind three header buttons. They are now one **PR Overview** panel: the description and checks stack on the left, comments fill the right, and checks collapse into a progressive-disclosure section with a colored progress label. The comments view gained author avatars, a single-row toolbar with search and filters, a \"hide bots\" toggle, and background refresh so the discussion and check state stay current while you review.\n+\n+The description and comments are also annotatable. Select text in the PR description and leave a comment, or click \"Annotate\" on any comment card to attach a note to the whole comment. These notes show in the Annotations sidebar under their own groups, count toward the review, and ship to the agent — with the full comment body quoted alongside your note, since the agent can't see the PR discussion on its own. Prose notes stay bound to the PR they were made on: switching to another PR in place hides them from view and export rather than carrying them onto the new PR, and switching back brings them right back. The description renders through the full shared block renderer, so tables, callouts, code, and embedded media (images, `\u003cvideo\u003e`, and `\u003cpicture\u003e`) all display inline.\n+\n+PR [#981](https://github.com/backnotprop/plannotator/pull/981), by @backnotprop.\n+\n+### Copy Agent Instructions in Code Review\n+\n+Plan mode has a \"Copy agent instructions\" action that hands an agent the exact clipboard contract for posting annotations back into Plannotator. That onboarding now exists in code review too, at parity with plan mode: the review header menu offers \"Agent Instructions\" in a live session, and the copied payload documents how to read the changeset, derive line numbers from the diff, and POST line-, file-, and general-scoped comments (including code suggestions). The backend already accepted these; this closes the missing on-ramp.\n+\n+PR [#983](https://github.com/backnotprop/plannotator/pull/983), by @backnotprop — suggested by @hakunin on X.\n+\n+### Additional Changes\n+\n+- **Immediate feedback when launching a review agent** — clicking Run in Review Agents now shows a pending launch row and a \"Starting\" state right away, surfaces server-side launch failures instead of silently clearing the request, and hands off cleanly to the real job once it starts. PR [#980](https://github.com/backnotprop/plannotator/pull/980), by @backnotprop.\n+- **Annotation count badge in the plan and annotate header** — the annotations toggle in the shared plan/annotate header now shows a numeric count badge, matching the code-review header. PR [#979](https://github.com/backnotprop/plannotator/pull/979), by @backnotprop.\n+- **Sturdier media and delimiter parsing** — the shared markdown parser no longer lets an unclosed `\u003cvideo\u003e`/`\u003cpicture\u003e` tag or a multi-line `\u003cimg\u003e` swallow or garble the rest of a document, and `\u003cpicture\u003e`/`\u003csource\u003e` and responsive `\u003cimg\u003e` now render correctly. This hardens the same renderer the math and PR Overview work rely on.\n+\n+## Install / Update\n+\n+**macOS / Linux:**\n+\n+```bash\n+curl -fsSL https://plannotator.ai/install.sh | bash\n+```\n+\n+**Windows:**\n+\n+```powershell\n+irm https://plannotator.ai/install.ps1 | iex\n+```\n+\n+**Extra skills** (compound, setup-goal, visual-explainer), opt-in:\n+\n+```bash\n+npx skills add backnotprop/plannotator/apps/skills/extra\n+```\n+\n+**Claude Code Plugin:** Run `/plugin` in Claude Code, find **plannotator**, and click **\"Update now\"**.\n+\n+**OpenCode:** Clear cache and restart:\n+\n+```bash\n+rm -rf ~/.bun/install/cache/@plannotator\n+```\n+\n+Then in `opencode.json`:\n+\n+```json\n+{\n+  \"plugin\": [\"@plannotator/opencode@latest\"]\n+}\n+```\n+\n+**Pi:** Install or update the extension:\n+\n+```bash\n+pi install npm:@plannotator/pi-extension\n+```\n+\n+**Droid:** Install via the plugin marketplace:\n+\n+```\n+droid plugin marketplace add backnotprop/plannotator\n+droid plugin install plannotator@plannotator\n+```\n+\n+**Amp:** Install the CLI first, then copy the plugin:\n+\n+```bash\n+mkdir -p ~/.config/amp/plugins\n+curl -fsSL https://raw.githubusercontent.com/backnotprop/plannotator/main/apps/amp-plugin/plannotator.ts \\\n+  -o ~/.config/amp/plugins/plannotator.ts\n+```\n+\n+**Kiro CLI:** The installer auto-detects Kiro and installs skills automatically. After installing the CLI, launch with:\n+\n+```bash\n+kiro-cli chat --agent plannotator\n+```\n+\n+Upgrading from before v0.20.0? Read the [v0.20.0 release notes](https://github.com/backnotprop/plannotator/releases/tag/v0.20.0) first; that release changed how skills install.\n+\n+---\n+\n+## What's Changed\n+\n+- feat(ui): render markdown math by @ishowman in [#878](https://github.com/backnotprop/plannotator/pull/878)\n+- feat(review): PR Overview panel + description/comment annotations + media by @backnotprop in [#981](https://github.com/backnotprop/plannotator/pull/981)\n+- feat(review): add \"Copy agent instructions\" for external review comments by @backnotprop in [#983](https://github.com/backnotprop/plannotator/pull/983)\n+- fix(review): show pending agent job launches by @backnotprop in [#980](https://github.com/backnotprop/plannotator/pull/980)\n+- feat(annotate): show annotation count badge in plan/annotate header by @backnotprop in [#979](https://github.com/backnotprop/plannotator/pull/979)\n+- fix(ui): stop unclosed `\u003cvideo\u003e`/`\u003cpicture\u003e` from swallowing the document by @backnotprop\n+- fix(review): scope PR description/comment notes to their PR by @backnotprop\n+- fix(ui): keep stray/unclosed math delimiters and dollar amounts from mangling text by @backnotprop\n+\n+## Contributors\n+\n+@ishowman built Markdown math rendering ([#878](https://github.com/backnotprop/plannotator/pull/878)), picking up the feature request in [#831](https://github.com/backnotprop/plannotator/issues/831) and implementing inline and display math with KaTeX, including selectable, annotatable formulas.\n+\n+Thanks also to the community members whose requests shaped this release:\n+\n+- @XxxXMil requested Markdown math formula rendering ([#831](https://github.com/backnotprop/plannotator/issues/831)), delivered in [#878](https://github.com/backnotprop/plannotator/pull/878).\n+- @hakunin suggested (on X) bringing the \"Copy agent instructions\" onboarding to code review, delivered in [#983](https://github.com/backnotprop/plannotator/pull/983).\n+\n+**Full Changelog**: https://github.com/backnotprop/plannotator/compare/v0.21.3...v0.21.4\ndiff --git a/RELEASE_NOTES_v0.22.0.md b/RELEASE_NOTES_v0.22.0.md\nnew file mode 100644\nindex 00000000..a5afd4ee\n--- /dev/null\n+++ b/RELEASE_NOTES_v0.22.0.md\n@@ -0,0 +1,150 @@\n+Follow [@plannotator](https://x.com/plannotator) on X for updates\n+\n+\u003cdetails\u003e\n+\u003csummary\u003e\u003cstrong\u003eMissed recent releases?\u003c/strong\u003e\u003c/summary\u003e\n+\n+| Release                                                                      | Highlights                                                                                                                       |\n+| ---------------------------------------------------------------------------- | -------------------------------------------------------------------------------------------------------------------------------- |\n+| [v0.21.4](https://github.com/backnotprop/plannotator/releases/tag/v0.21.4)   | Markdown math rendering, PR Overview panel with annotatable description and comments, agent instructions in code review, media parsing fixes |\n+| [v0.21.3](https://github.com/backnotprop/plannotator/releases/tag/v0.21.3)   | File comments in code review, unified click-to-highlight comments, VS Code clipboard/keyboard bridge, Codex Ask AI on app-server transport, CLI subcommand help |\n+| [v0.21.2](https://github.com/backnotprop/plannotator/releases/tag/v0.21.2)   | Custom reviews as Agent Skills, Cursor + OpenCode review engines, whole-file/general findings, deleted-annotation fix, Codex Ask AI outside git repos |\n+| [v0.21.1](https://github.com/backnotprop/plannotator/releases/tag/v0.21.1)   | Annotate-last blank-page fix on multi-message sessions                                                                            |\n+| [v0.21.0](https://github.com/backnotprop/plannotator/releases/tag/v0.21.0)   | Direct document editing in annotate mode, live git-status file tree, in-app agent terminal, open files in external apps, HTML renders as HTML |\n+| [v0.20.3](https://github.com/backnotprop/plannotator/releases/tag/v0.20.3)   | Annotations no longer lost when clicking away, off-screen indicator for open comments                                            |\n+| [v0.20.2](https://github.com/backnotprop/plannotator/releases/tag/v0.20.2)   | Pierre CodeView all-files review, large-PR pipeline and instant-open checkout, unified agent engine selection, Pi programmatic plan mode |\n+| [v0.20.1](https://github.com/backnotprop/plannotator/releases/tag/v0.20.1)   | Pi extension install hotfix (pinned `@pierre/diffs` after a broken upstream release)                                             |\n+| [v0.20.0](https://github.com/backnotprop/plannotator/releases/tag/v0.20.0)   | Multi-repo workspace reviews, semantic diff overview, UI 2.0 themes and plan look chooser, leaner single-source skill install   |\n+| [v0.19.27](https://github.com/backnotprop/plannotator/releases/tag/v0.19.27) | Kiro CLI integration, Glimpse native window, annotate-last message picker                                                        |\n+| [v0.19.26](https://github.com/backnotprop/plannotator/releases/tag/v0.19.26) | Amp plugin production fixes, Mermaid rendering fix, Settings flicker fix, update notification toast and shimmer                   |\n+\n+\u003c/details\u003e\n+\n+---\n+\n+## What's New in v0.22.0\n+\n+This release rebuilds the code review left panel around how a review actually starts: a git-status view of everything since your base branch is now the default, a Commits panel gives you the branch's history with per-commit diffs, and Guided Review turns any changeset into an agent-organized, chaptered walkthrough with live annotatable diffs. Pi and GitHub Copilot CLI join Cursor and OpenCode as review engines. Five PRs and four direct fixes land, all from the core team, verified by a 24-point QA pass before tagging.\n+\n+### The review now opens on \"All changes\"\n+\n+Code reviews used to open on unstaged changes, which answers \"what did I just edit\" but not the question most reviews start with: \"what would a PR show if I pushed right now?\" The new default diff answers exactly that. **All changes** compares the merge base with your base branch against the working tree and includes untracked files — committed work, uncommitted edits, and brand-new files in one view.\n+\n+It renders as a **Git status** panel with three sections that mirror `git status`: **Committed**, **Changes**, and **Untracked**. Each row carries viewed tracking, a stage/unstage button, the change-type letter, and +/- counts, so you can stage files as you review without leaving the app. If the base branch has moved on GitHub since your last fetch, a banner offers a one-click fetch so you're reviewing against the real base.\n+\n+A first-run dialog lets you pick your default view and diff type (with live previews), and both remain changeable in Settings → Git or from the review header menu. On repos where a base branch can't be resolved, the review falls back to uncommitted changes rather than hiding committed work.\n+\n+PR [#990](https://github.com/backnotprop/plannotator/pull/990), by @backnotprop.\n+\n+### Commits panel\n+\n+The panel toggle gained a third view: **Commits**, a linear history rail of your branch, newest first, with author avatars and an \"In origin/main\" divider where your work meets the base. Clicking a commit opens that commit's own diff against its parent — `git show`, but annotatable — headed by the full commit message rendered as markdown.\n+\n+The toggle is session-scoped: glancing at Commits (or Tree) mid-review never silently changes your saved default, and a review always opens on files, never on a historical commit. Avatars resolve by author email through the repo's forge and fall back to initials when there's no remote or CLI to ask.\n+\n+PR [#994](https://github.com/backnotprop/plannotator/pull/994), by @backnotprop.\n+\n+### Guided Review\n+\n+Large changesets are hard to review top-to-bottom in file order. A **Guided Review** has an agent organize the current changeset — any PR or local diff — into importance-ordered chapters: the heart of the change first, its consequences next, glue last. Each section pairs a prose overview and per-file summaries with the live diffs it covers, and those diffs are the real diff viewer — annotations made inside a guide land in the same review state and export in the same feedback as everywhere else.\n+\n+Open it with the **Guide** button in the review header or `Mod+Shift+G`, pick an engine and model, and generate. Sections track their own reviewed state so you can work through a big change across sittings. Guides run on Claude or Codex natively, and on Cursor, OpenCode, Pi, or GitHub Copilot CLI when installed. Every changed file is validated against the real diff server-side, so a guide can never invent files or drop them silently.\n+\n+A one-time intro dialog announces the feature on first open, and the Guide button carries a subtle hint until the first time you use it.\n+\n+PRs [#993](https://github.com/backnotprop/plannotator/pull/993), [#997](https://github.com/backnotprop/plannotator/pull/997), and [#1000](https://github.com/backnotprop/plannotator/pull/1000), by @backnotprop.\n+\n+### Pi and GitHub Copilot CLI as review engines\n+\n+The review and guide launchers gained two engines. **Pi** rides your existing Pi login (OAuth subscription or keys) with live model discovery and thinking-level control — and the Pi extension can launch Pi, so Pi users get agent reviews with zero extra setup. **GitHub Copilot CLI** runs in a locked-down non-interactive posture: no write access, a shell allowlist limited to git-family commands, and clean auto-denial for anything else.\n+\n+That brings the engine roster to Claude, Codex, Cursor, OpenCode, Pi, and Copilot — and the engine layer was refactored so the next one is a two-edit change.\n+\n+PRs [#993](https://github.com/backnotprop/plannotator/pull/993) and [#997](https://github.com/backnotprop/plannotator/pull/997), by @backnotprop.\n+\n+### Additional Changes\n+\n+- **Filenames stay visible in the Git status panel** — long paths now truncate in the directory portion (ellipsis before the final slash) so the filename always shows; a pathologically long filename truncates at its own end.\n+- **Commit-diff annotations stay anchored to their commit** — annotations made on a historical commit's diff are stamped with that commit, and the exported feedback labels any annotation whose anchor doesn't match the diff being sent, so an agent never reads a commit's line numbers against the working tree.\n+- **Avatar lookups can't delay the commit list** — forge avatar resolution now has a hard 4-second ceiling; on a hanging network the Commits panel loads immediately with initials and picks up avatars once they arrive.\n+- **Code review reference docs updated** — the docs page now describes the since-base default, the three panel views, Guided Review, the full engine roster, and the current server API.\n+\n+## Install / Update\n+\n+**macOS / Linux:**\n+\n+```bash\n+curl -fsSL https://plannotator.ai/install.sh | bash\n+```\n+\n+**Windows:**\n+\n+```powershell\n+irm https://plannotator.ai/install.ps1 | iex\n+```\n+\n+**Extra skills** (compound, setup-goal, visual-explainer), opt-in:\n+\n+```bash\n+npx skills add backnotprop/plannotator/apps/skills/extra\n+```\n+\n+**Claude Code Plugin:** Run `/plugin` in Claude Code, find **plannotator**, and click **\"Update now\"**.\n+\n+**OpenCode:** Clear cache and restart:\n+\n+```bash\n+rm -rf ~/.bun/install/cache/@plannotator\n+```\n+\n+Then in `opencode.json`:\n+\n+```json\n+{\n+  \"plugin\": [\"@plannotator/opencode@latest\"]\n+}\n+```\n+\n+**Pi:** Install or update the extension:\n+\n+```bash\n+pi install npm:@plannotator/pi-extension\n+```\n+\n+**Droid:** Install via the plugin marketplace:\n+\n+```\n+droid plugin marketplace add backnotprop/plannotator\n+droid plugin install plannotator@plannotator\n+```\n+\n+**Amp:** Install the CLI first, then copy the plugin:\n+\n+```bash\n+mkdir -p ~/.config/amp/plugins\n+curl -fsSL https://raw.githubusercontent.com/backnotprop/plannotator/main/apps/amp-plugin/plannotator.ts \\\n+  -o ~/.config/amp/plugins/plannotator.ts\n+```\n+\n+**Kiro CLI:** The installer auto-detects Kiro and installs skills automatically. After installing the CLI, launch with:\n+\n+```bash\n+kiro-cli chat --agent plannotator\n+```\n+\n+Upgrading from before v0.20.0? Read the [v0.20.0 release notes](https://github.com/backnotprop/plannotator/releases/tag/v0.20.0) first; that release changed how skills install.\n+\n+---\n+\n+## What's Changed\n+\n+- feat(review): \"All changes\" git-status review view by @backnotprop in [#990](https://github.com/backnotprop/plannotator/pull/990)\n+- feat(review): Commits panel — linear history rail with per-commit diffs by @backnotprop in [#994](https://github.com/backnotprop/plannotator/pull/994)\n+- feat(review): Guided Review + Pi agent-job provider by @backnotprop in [#993](https://github.com/backnotprop/plannotator/pull/993)\n+- feat: guide per-file summaries + GitHub Copilot CLI agent engine by @backnotprop in [#997](https://github.com/backnotprop/plannotator/pull/997)\n+- feat(review): Guided Reviews intro dialog + Guide button discovery hint by @backnotprop in [#1000](https://github.com/backnotprop/plannotator/pull/1000)\n+- fix(review): keep the filename visible in git-status rows by @backnotprop\n+- fix(review): anchor commit-diff annotations to their commit in feedback by @backnotprop\n+- fix(review): avatar lookups can no longer delay /api/commits by @backnotprop\n+- docs(marketing): bring the code-review reference up to the since-base era by @backnotprop\n+\n+**Full Changelog**: https://github.com/backnotprop/plannotator/compare/v0.21.4...v0.22.0\ndiff --git a/RELEASE_NOTES_v0.23.0.md b/RELEASE_NOTES_v0.23.0.md\nnew file mode 100644\nindex 00000000..b277727c\n--- /dev/null\n+++ b/RELEASE_NOTES_v0.23.0.md\n@@ -0,0 +1,219 @@\n+Follow [@plannotator](https://x.com/plannotator) on X for updates\n+\n+\u003cdetails\u003e\n+\u003csummary\u003e\u003cstrong\u003eMissed recent releases?\u003c/strong\u003e\u003c/summary\u003e\n+\n+| Release                                                                      | Highlights                                                                                                                       |\n+| ---------------------------------------------------------------------------- | -------------------------------------------------------------------------------------------------------------------------------- |\n+| [v0.22.0](https://github.com/backnotprop/plannotator/releases/tag/v0.22.0)   | Git-status \"All changes\" default review view, Commits panel with per-commit diffs, Guided Review, Pi + GitHub Copilot CLI review engines |\n+| [v0.21.4](https://github.com/backnotprop/plannotator/releases/tag/v0.21.4)   | Markdown math rendering, PR Overview panel with annotatable description and comments, agent instructions in code review, media parsing fixes |\n+| [v0.21.3](https://github.com/backnotprop/plannotator/releases/tag/v0.21.3)   | File comments in code review, unified click-to-highlight comments, VS Code clipboard/keyboard bridge, Codex Ask AI on app-server transport, CLI subcommand help |\n+| [v0.21.2](https://github.com/backnotprop/plannotator/releases/tag/v0.21.2)   | Custom reviews as Agent Skills, Cursor + OpenCode review engines, whole-file/general findings, deleted-annotation fix, Codex Ask AI outside git repos |\n+| [v0.21.1](https://github.com/backnotprop/plannotator/releases/tag/v0.21.1)   | Annotate-last blank-page fix on multi-message sessions                                                                            |\n+| [v0.21.0](https://github.com/backnotprop/plannotator/releases/tag/v0.21.0)   | Direct document editing in annotate mode, live git-status file tree, in-app agent terminal, open files in external apps, HTML renders as HTML |\n+| [v0.20.3](https://github.com/backnotprop/plannotator/releases/tag/v0.20.3)   | Annotations no longer lost when clicking away, off-screen indicator for open comments                                            |\n+| [v0.20.2](https://github.com/backnotprop/plannotator/releases/tag/v0.20.2)   | Pierre CodeView all-files review, large-PR pipeline and instant-open checkout, unified agent engine selection, Pi programmatic plan mode |\n+| [v0.20.1](https://github.com/backnotprop/plannotator/releases/tag/v0.20.1)   | Pi extension install hotfix (pinned `@pierre/diffs` after a broken upstream release)                                             |\n+| [v0.20.0](https://github.com/backnotprop/plannotator/releases/tag/v0.20.0)   | Multi-repo workspace reviews, semantic diff overview, UI 2.0 themes and plan look chooser, leaner single-source skill install   |\n+| [v0.19.27](https://github.com/backnotprop/plannotator/releases/tag/v0.19.27) | Kiro CLI integration, Glimpse native window, annotate-last message picker                                                        |\n+\n+\u003c/details\u003e\n+\n+---\n+\n+## What's New in v0.23.0\n+\n+This is a community release: 22 PRs, seven of them authored by community contributors, five of whom are contributing for the first time. Plan approval works again on current Claude Code versions, annotate mode gains the version diff that plan mode has always had, the installer learns a binary-only mode, and a wave of Windows, OpenCode, and WebKit fixes lands. The whole changeset went through a multi-day adversarial QA pass — every commit audited, installers exercised end-to-end — before tagging.\n+\n+### Plan approval works again on Claude Code 2.1.199+\n+\n+Claude Code 2.1.199 added a guard that discards a `PermissionRequest` allow decision for `ExitPlanMode` when `updatedInput` is absent. The result: clicking **Approve** in the plan review UI closed the page, but the built-in approval dialog reappeared in the terminal as if nothing happened. Deny was unaffected, which made the failure look like a Plannotator bug rather than a protocol change.\n+\n+The hook now echoes the plan back as `updatedInput` alongside the allow decision, which satisfies the new guard on 2.1.199+ and is ignored harmlessly by older versions. If plan approval stopped working for you recently, this release fixes it.\n+\n+PR [#1008](https://github.com/backnotprop/plannotator/pull/1008) by @flex-yj-kim, closing [#995](https://github.com/backnotprop/plannotator/issues/995) reported by @axelboman277.\n+\n+### Annotate mode: version diff for your files\n+\n+Plan mode has always shown a `+N/-M` badge when a plan is resubmitted, with a highlighted diff of what changed between versions. Annotate mode had the same diff UI sitting unused, because the annotate server never tracked history. Now it does: opening a `.md` or `.html` file saves a version keyed by file path, and re-opening the same file later shows exactly what changed since you last annotated it — same badge, same rendered diff, same Version Browser in the sidebar.\n+\n+HTML files annotated with `--render-html` get the diff as the real rendered page with inline insertion/deletion highlights, not a wall of markup. History is stored under `~/.plannotator/history/`; if you'd rather keep annotate sessions stateless, disable it with `PLANNOTATOR_ANNOTATE_HISTORY=0` or `{ \"annotateHistory\": false }` in `~/.plannotator/config.json`. A follow-up hardening in this release also makes the history write best-effort: an unwritable data directory degrades to a normal no-diff session instead of failing to open.\n+\n+PR [#961](https://github.com/backnotprop/plannotator/pull/961) by @egouilliard-leyton, who also proposed the feature in [#960](https://github.com/backnotprop/plannotator/issues/960).\n+\n+### Binary-only install with `--minimal`\n+\n+The installer writes more than the binary: the sem semantic-diff sidecar, the agent-terminal runtime, and per-agent skills, hooks, and commands for Claude, Codex, OpenCode, Gemini, and Kiro. For users who want none of that, there was no way to opt out. Now there is:\n+\n+```bash\n+curl -fsSL https://plannotator.ai/install.sh | bash -s -- --minimal\n+```\n+\n+`--minimal` (alias `--binary-only`, env var `PLANNOTATOR_MINIMAL=1`) installs the `plannotator` binary and stops — no sidecars, no skills, no hooks, no config writes. It works identically across `install.sh`, `install.ps1`, and `install.cmd`, and `--no-minimal` overrides a persistently exported env var. The mode is non-destructive: running it over an existing full install upgrades the binary and leaves everything else alone.\n+\n+PR [#989](https://github.com/backnotprop/plannotator/pull/989) by @Staninna, closing [#977](https://github.com/backnotprop/plannotator/issues/977) reported by @wauxhall.\n+\n+### Reviews post as you, without attribution\n+\n+Submitting a PR review to GitHub or GitLab used to append \"Review from Plannotator\" to the review body. That text is gone. Your general comment and file-scoped feedback post exactly as you wrote them; when GitHub requires a top-level body for an inline-only comment review, a neutral \"See inline comments.\" is used instead; approvals and GitLab inline-only discussions stay bodyless.\n+\n+PR [#1033](https://github.com/backnotprop/plannotator/pull/1033) by @backnotprop, superseding [#1026](https://github.com/backnotprop/plannotator/pull/1026) by @leoreisdias, who pushed for the change.\n+\n+### Windows: hooks survive spaces in your install path, installers render cleanly\n+\n+Two classes of Windows breakage are fixed. First, the generated Claude Code hook commands embedded the absolute exe path unquoted — on any machine whose profile path contains a space (`C:\\Users\\John Smith\\...`), the hook command word-split and plan review silently never intercepted. Both Windows installers now quote the path, and the install test harness pins it.\n+\n+Second, PR [#1021](https://github.com/backnotprop/plannotator/pull/1021) by @ShiroKSH fixed a broad set of Windows edge cases: the PowerShell installer now parses correctly under stock Windows PowerShell 5.1 (all non-ASCII characters removed, with a regression test), Amp workspace and binary paths normalize across platforms, Ask AI server turns abort cleanly when sessions reset, and Pi archive/config behaviors match Bun's. The same ASCII treatment was then applied to `install.cmd`, whose status messages rendered as mojibake on default Windows code pages.\n+\n+### Annotate folders: filter the file tree\n+\n+Annotating a folder now gives you a filter row above the file tree. Type any set of words and they AND-match against file names and paths; matching folders expand automatically while you type, and Escape clears the filter before it closes the browser. Behind it, the folder scan is capped at 5,000 files (configurable via `PLANNOTATOR_FILE_BROWSER_MAX_FILES`) so a giant monorepo can't hang the browser — and your own modified and untracked files are seeded into the tree first, so the files you just edited always appear no matter how large the folder is.\n+\n+PRs [#1027](https://github.com/backnotprop/plannotator/pull/1027) and [#1022](https://github.com/backnotprop/plannotator/pull/1022) by @backnotprop.\n+\n+### OpenCode: session URLs you can actually see\n+\n+Remote OpenCode users (SSH, devcontainers) periodically hit the same wall: the plan or review server starts, but the URL to open it never appears anywhere visible. The root cause turned out to be structural — every URL was routed through `client.app.log`, which OpenCode writes to its server log file, never the TUI. Session URLs now also surface as TUI toast notifications, delivered through the SDK's visible channel, deduplicated per session, and harmless on older OpenCode hosts that predate the toast endpoint.\n+\n+Two more OpenCode fixes ride along: model dropdown labels are disambiguated by provider ([#1024](https://github.com/backnotprop/plannotator/pull/1024) by @yusufemreboyraz, closing [#988](https://github.com/backnotprop/plannotator/issues/988) reported by @ak64th), so `deepseek-v4-pro` from DeepSeek and OpenRouter are tellable apart — and annotate version history is now scoped per project on OpenCode, matching the other runtimes.\n+\n+### Additional Changes\n+\n+- **Comment editor focuses on open in WebKit hosts** — selecting text opens the comment editor with the textarea actually focused; WKWebView hosts (like the Glimpse native window) previously required tabbing into it. PR [#1031](https://github.com/backnotprop/plannotator/pull/1031) by @BrandonNoad.\n+- **Annotate sidebar keyboard shortcuts** — toggle the Contents and Files panels from the keyboard, with the bindings listed in Settings while in annotate mode. PR [#986](https://github.com/backnotprop/plannotator/pull/986) by @leoreisdias.\n+- **GPT-5.6 model family in the Codex job selector** — `gpt-5.6` (sol), `gpt-5.6-terra`, and `gpt-5.6-luna` are selectable for review jobs, Code Tours, and Guided Reviews. Ask AI discovers Codex models dynamically and needed no change.\n+- **First-time PR reviewers get a destination pointer** — a one-time spotlight on the Agent / GitHub switcher explains that feedback can post to the PR or go to your agent session, and that double-tapping Alt toggles it.\n+- **PR comments render tables and inline video** — GitHub PR descriptions, comments, and commit messages with markdown tables or video attachments now render properly in the review Overview. PR [#1007](https://github.com/backnotprop/plannotator/pull/1007).\n+- **HTML files render untouched** — annotating an `.html` file renders the document byte-for-byte in a sandboxed frame instead of normalizing it. PR [#1023](https://github.com/backnotprop/plannotator/pull/1023).\n+- **Resize handles: click to collapse** — panel resize handles collapse on click along their full height, with a cursor hint, and the hover highlight can be suppressed by hosts. PR [#1028](https://github.com/backnotprop/plannotator/pull/1028).\n+- **Read-only data directories can't block sessions** — an unwritable `~/.plannotator` (read-only mount, full disk) now degrades annotate history and session discovery gracefully instead of failing startup.\n+- **Component library migrated to Base UI** — the plan and review UIs moved from Radix to Base UI with behavior preserved, part of publishing the document UI as reusable packages. PRs [#957](https://github.com/backnotprop/plannotator/pull/957), [#1013](https://github.com/backnotprop/plannotator/pull/1013), [#1014](https://github.com/backnotprop/plannotator/pull/1014), [#1017](https://github.com/backnotprop/plannotator/pull/1017).\n+- **plannotator.ai/code-review** — a dedicated landing page for the code review side of Plannotator, with an inline Guided Review demo. PRs [#1003](https://github.com/backnotprop/plannotator/pull/1003), [#1006](https://github.com/backnotprop/plannotator/pull/1006), [#1012](https://github.com/backnotprop/plannotator/pull/1012).\n+\n+## Install / Update\n+\n+**macOS / Linux:**\n+\n+```bash\n+curl -fsSL https://plannotator.ai/install.sh | bash\n+```\n+\n+**Windows:**\n+\n+```powershell\n+irm https://plannotator.ai/install.ps1 | iex\n+```\n+\n+**Extra skills** (compound, setup-goal, visual-explainer), opt-in:\n+\n+```bash\n+npx skills add backnotprop/plannotator/apps/skills/extra\n+```\n+\n+**Claude Code Plugin:** Run `/plugin` in Claude Code, find **plannotator**, and click **\"Update now\"**.\n+\n+**OpenCode:** Clear cache and restart:\n+\n+```bash\n+rm -rf ~/.bun/install/cache/@plannotator\n+```\n+\n+Then in `opencode.json`:\n+\n+```json\n+{\n+  \"plugin\": [\"@plannotator/opencode@latest\"]\n+}\n+```\n+\n+**Pi:** Install or update the extension:\n+\n+```bash\n+pi install npm:@plannotator/pi-extension\n+```\n+\n+**Droid:** Install via the plugin marketplace:\n+\n+```\n+droid plugin marketplace add backnotprop/plannotator\n+droid plugin install plannotator@plannotator\n+```\n+\n+**Amp:** Install the CLI first, then copy the plugin:\n+\n+```bash\n+mkdir -p ~/.config/amp/plugins\n+curl -fsSL https://raw.githubusercontent.com/backnotprop/plannotator/main/apps/amp-plugin/plannotator.ts \\\n+  -o ~/.config/amp/plugins/plannotator.ts\n+```\n+\n+**Kiro CLI:** The installer auto-detects Kiro and installs skills automatically. After installing the CLI, launch with:\n+\n+```bash\n+kiro-cli chat --agent plannotator\n+```\n+\n+Upgrading from before v0.20.0? Read the [v0.20.0 release notes](https://github.com/backnotprop/plannotator/releases/tag/v0.20.0) first; that release changed how skills install.\n+\n+---\n+\n+## What's Changed\n+\n+- fix(hook): echo tool_input as updatedInput so plan approval survives Claude Code 2.1.199+ by @flex-yj-kim in [#1008](https://github.com/backnotprop/plannotator/pull/1008)\n+- feat(annotate): per-file version diff for .md and .html by @egouilliard-leyton in [#961](https://github.com/backnotprop/plannotator/pull/961)\n+- feat(install): add --minimal binary-only install mode by @Staninna in [#989](https://github.com/backnotprop/plannotator/pull/989)\n+- Fix Windows install and review edge cases by @ShiroKSH in [#1021](https://github.com/backnotprop/plannotator/pull/1021)\n+- Disambiguate OpenCode model dropdown labels by provider by @yusufemreboyraz in [#1024](https://github.com/backnotprop/plannotator/pull/1024)\n+- fix(ui): comment editor textarea not focused on open in WebKit hosts by @BrandonNoad in [#1031](https://github.com/backnotprop/plannotator/pull/1031)\n+- feat(annotate): add sidebar shortcuts by @leoreisdias in [#986](https://github.com/backnotprop/plannotator/pull/986)\n+- fix(review): remove automatic platform attribution by @backnotprop in [#1033](https://github.com/backnotprop/plannotator/pull/1033)\n+- Make the document UI reusable as published building blocks by @backnotprop in [#957](https://github.com/backnotprop/plannotator/pull/957)\n+- Migrate @plannotator/ui to Base UI by @backnotprop in [#1013](https://github.com/backnotprop/plannotator/pull/1013)\n+- Migrate packages/review-editor to Base UI by @backnotprop in [#1014](https://github.com/backnotprop/plannotator/pull/1014)\n+- Consumer enablement for @plannotator/ui by @backnotprop in [#1017](https://github.com/backnotprop/plannotator/pull/1017)\n+- fix(review): render tables + inline video in PR comments, descriptions, and commit messages by @backnotprop in [#1007](https://github.com/backnotprop/plannotator/pull/1007)\n+- Render arbitrary HTML in HtmlViewer without altering it by @backnotprop in [#1023](https://github.com/backnotprop/plannotator/pull/1023)\n+- Add file browser filtering by @backnotprop in [#1027](https://github.com/backnotprop/plannotator/pull/1027)\n+- Fix annotate terminal startup in large folders by @backnotprop in [#1022](https://github.com/backnotprop/plannotator/pull/1022)\n+- feat(ui): handle-wide click-to-collapse + suppressible hover on resize handles by @backnotprop in [#1028](https://github.com/backnotprop/plannotator/pull/1028)\n+- chore(ui): move to the plannotator/atomic-editor fork by @backnotprop in [#1002](https://github.com/backnotprop/plannotator/pull/1002)\n+- Code review landing page with demo video by @backnotprop in [#1003](https://github.com/backnotprop/plannotator/pull/1003)\n+- Code review page: copy pass + inline guided-review demo by @backnotprop in [#1006](https://github.com/backnotprop/plannotator/pull/1006)\n+- Dedicated OG/social image for /code-review by @backnotprop in [#1012](https://github.com/backnotprop/plannotator/pull/1012)\n+- fix(opencode): surface session URLs via TUI toasts by @backnotprop\n+- fix(install): quote exe path in Windows hook commands; ASCII-purge install.cmd by @backnotprop\n+- fix(server): unwritable data dir degrades annotate/sessions instead of failing startup by @backnotprop\n+- feat(ui): add GPT-5.6 family to the Codex job model catalog by @backnotprop\n+- feat(review): one-time spotlight on the PR feedback-destination switcher by @backnotprop\n+\n+## New Contributors\n+\n+- @Staninna made their first contribution in [#989](https://github.com/backnotprop/plannotator/pull/989)\n+- @egouilliard-leyton made their first contribution in [#961](https://github.com/backnotprop/plannotator/pull/961)\n+- @yusufemreboyraz made their first contribution in [#1024](https://github.com/backnotprop/plannotator/pull/1024)\n+- @BrandonNoad made their first contribution in [#1031](https://github.com/backnotprop/plannotator/pull/1031)\n+- @ShiroKSH made their first contribution in [#1021](https://github.com/backnotprop/plannotator/pull/1021)\n+\n+## Contributors\n+\n+@flex-yj-kim tracked the Claude Code 2.1.199 protocol change to its exact guard and shipped the `updatedInput` echo that makes plan approval work again ([#1008](https://github.com/backnotprop/plannotator/pull/1008)), a fix most of the plugin's users will feel immediately.\n+\n+@egouilliard-leyton proposed the annotate version diff in [#960](https://github.com/backnotprop/plannotator/issues/960) and then built it ([#961](https://github.com/backnotprop/plannotator/pull/961)), including the rendered-HTML diff with inline highlights. First contribution.\n+\n+@Staninna built the `--minimal` install mode across all three installer scripts ([#989](https://github.com/backnotprop/plannotator/pull/989)). First contribution.\n+\n+@ShiroKSH swept a wide set of Windows edge cases in one PR ([#1021](https://github.com/backnotprop/plannotator/pull/1021)) — installer encoding, path normalization, Ask AI abort behavior, and Pi parity details. First contribution.\n+\n+@yusufemreboyraz fixed the ambiguous OpenCode model labels ([#1024](https://github.com/backnotprop/plannotator/pull/1024)). First contribution.\n+\n+@BrandonNoad root-caused the WebKit focus quirk and moved the comment editor's focus to a ref callback ([#1031](https://github.com/backnotprop/plannotator/pull/1031)). First contribution.\n+\n+@leoreisdias added the annotate sidebar shortcuts ([#986](https://github.com/backnotprop/plannotator/pull/986)) and drove the removal of review attribution — his [#1026](https://github.com/backnotprop/plannotator/pull/1026) shaped the approach that shipped in [#1033](https://github.com/backnotprop/plannotator/pull/1033).\n+\n+Community members who reported issues that drove changes in this release:\n+\n+- @axelboman277: [#995](https://github.com/backnotprop/plannotator/issues/995) (plan approval silently ignored on Claude Code ≥ 2.1.200), with @blimmer adding reproduction detail in the discussion\n+- @wauxhall: [#977](https://github.com/backnotprop/plannotator/issues/977) (installer writes state the user didn't ask for)\n+- @ak64th: [#988](https://github.com/backnotprop/plannotator/issues/988) (duplicate OpenCode model labels across providers)\n+\n+**Full Changelog**: https://github.com/backnotprop/plannotator/compare/v0.22.0...v0.23.0\ndiff --git a/adr/0003-example-architecture-decision.md b/adr/0003-example-architecture-decision.md\nnew file mode 100644\nindex 00000000..b4095670\n--- /dev/null\n+++ b/adr/0003-example-architecture-decision.md\n@@ -0,0 +1,25 @@\n+# 3. Example architecture decision\n+\n+Date: 2026-06-19\n+\n+## Status\n+\n+Example\n+\n+## Context\n+\n+This ADR is an example document. It shows the expected shape and level of detail for future architecture decision records without recording a binding project decision.\n+\n+Use the context section to explain the problem, constraints, and relevant background. This section should make the decision understandable to someone who was not present for the discussion.\n+\n+## Decision\n+\n+Record the chosen option here.\n+\n+Describe the decision in concrete terms. Include enough detail to distinguish it from alternatives, but keep implementation specifics out unless they are part of the architecture-level choice.\n+\n+## Consequences\n+\n+Explain the results of the decision.\n+\n+Include benefits, tradeoffs, follow-up work, and known risks. Consequences should help future maintainers understand why the decision was acceptable when it was made.\ndiff --git a/adr/research/SPIKE-bundle-build-and-serve-architecture-20260619-154926.md b/adr/research/SPIKE-bundle-build-and-serve-architecture-20260619-154926.md\nnew file mode 100644\nindex 00000000..bd5c5a19\n--- /dev/null\n+++ b/adr/research/SPIKE-bundle-build-and-serve-architecture-20260619-154926.md\n@@ -0,0 +1,105 @@\n+# SPIKE: How Plannotator builds, packages, and serves its UI bundle\n+\n+Date: 2026-06-19\n+Status: Research (read-only). No code changed.\n+Method: 10-agent research workflow (4 architecture scouts → 5 traced theories → synthesis), plus direct measurement and verification by the lead.\n+\n+This is the factual map. The optimization analysis lives in the companion spike: `SPIKE-bundle-optimization-theories-20260619-154926.md`.\n+\n+---\n+\n+## TL;DR\n+\n+There are **two** built UI bundles, both produced as **single-file inlined HTML** by Vite + `vite-plugin-singlefile`. The plan/annotate surface ships `index.html` at **21,034,896 bytes raw / ~6.0–6.25 MB gzip**, of which **~20.3 MB (97%) is one inlined `\u003cscript\u003e`**. It is embedded into the compiled binary as a text string and served on a **random OS-assigned port with zero cache headers**. The browser re-downloads (cheap, 10–16 ms on localhost) and then **re-parses/executes the full ~20 MB of JS on every open** — which is the ~5 s blank screen in issue #926. Network is not the cost; parse/execute is.\n+\n+---\n+\n+## The two bundles\n+\n+| Bundle | Built from | Serves | Raw | Gzip | Inlined JS |\n+|---|---|---|---|---|---|\n+| `index.html` (PLAN editor) | `apps/hook` → `packages/editor/App.tsx` | plan review, annotate (file/url/folder), annotate-last, archive | 21,034,896 B | ~6.0–6.25 MB | ~20.3 MB (97.2%) |\n+| `review.html` (CODE REVIEW editor) | `apps/review` → `packages/review-editor/App.tsx` | code review subcommands only | 15,341,205 B | ~4.0 MB | ~14.6 MB |\n+| `redline.html` | `cp dist/index.html dist/redline.html` | **nothing** — byte-identical dead artifact | 21,034,896 B | — | — |\n+\n+There is **no separate annotate bundle**: annotate reuses the plan editor (`index.html`) with mode flags. `redline.html` is built and copied by `apps/hook/package.json:8` but is **never imported or served** (`cmp` confirms it is identical to `index.html`; grep finds zero `with { type: \"text\" }` or server reference). \"redline\" exists only as an `EditorMode` string (`packages/ui/types.ts:7`). It is ~20 MB of pure dead build output.\n+\n+---\n+\n+## How the single-file build works\n+\n+Both `apps/review/vite.config.ts` and `apps/hook/vite.config.ts` force everything into one file:\n+\n+- `viteSingleFile()` — last plugin; rewrites the entry into one self-contained HTML.\n+- `assetsInlineLimit: 100000000` — inline **all** assets (fonts, images) as base64.\n+- `cssCodeSplit: false` — one `\u003cstyle\u003e` block (plan CSS = 3.78 MB; ~3.5 MB rules + ~0.28 MB data-URIs).\n+- `rollupOptions.output.inlineDynamicImports: true` — **collapse every dynamic import into the one chunk**. No code-splitting, no lazy loading.\n+- `worker: { format: 'es', rollupOptions.output.inlineDynamicImports: true }` — the Pierre highlight worker (`?worker\u0026inline`) has a `import('shiki/wasm')` branch that Vite's default iife worker can't split, so the WASM/shiki branch is collapsed into the inlined worker blob too.\n+\n+The net effect: **one HTML file, all JS/CSS/worker/fonts/assets inlined, zero deferred chunks, full parse on every open.**\n+\n+---\n+\n+## How it gets into the binary and the other runtimes\n+\n+- **Claude Code (apps/hook):** `apps/hook/server/index.ts:146,150` does `import planHtml from \"../dist/index.html\" with { type: \"text\" }` and the same for `review.html`. Bun loads each as a string constant; `bun build apps/hook/server/index.ts --compile --no-compile-autoload-bunfig --target=\u003cplatform\u003e ...` (`release.yml:79-100`) bakes both strings into each of the 6 per-OS standalone binaries. Only **two** HTML strings are embedded (`planHtml`, `reviewHtml`).\n+- **OpenCode (apps/opencode-plugin):** ships `plannotator.html` (= hook `index.html`) and `review-editor.html` (= review `index.html`) as package `files`, `readFileSync` at runtime (`index.ts:90/95`).\n+- **Pi (apps/pi-extension):** copies the same two files, `readFileSync` once at module load (`plannotator-browser.ts:68/74`).\n+\n+`planHtmlContent` is served for plan, annotate, annotate-last, and archive (call sites at `index.ts` 484/1029/1227/1270/1328/1574/1637/1725/1829/1908); `reviewHtmlContent` only for review (831/1486).\n+\n+---\n+\n+## How it is served (the load path)\n+\n+1. The Bun server binds a **random OS-assigned port** locally (`port = 0`) or fixed `19432` remote (`packages/server/remote.ts:11,65`).\n+2. The HTTP response for the document carries **only `Content-Type: text/html`** — **no `Cache-Control`, no `ETag`, and `Content-Encoding: identity`** (not gzipped on the wire) (`packages/server/index.ts:578`).\n+3. Localhost transfer of the 21 MB raw body measured at **10–16 ms** — download is negligible.\n+4. The browser then **parses and executes ~20.3 MB of JS up front** before first paint. Because each invocation is a new random port = a **new origin**, the browser cannot reuse its disk cache or its **V8 compiled-bytecode cache** across opens. So the parse cost is paid **every time**, not just first launch — exactly matching #926's \"every time, not only first launch.\"\n+\n+The `isLoading` gate (`packages/editor/App.tsx:384,1318`) currently renders a bare colored div during this window, so the user sees a featureless blank rather than a progress indicator.\n+\n+---\n+\n+## What is actually inside the plan bundle (measured weight)\n+\n+Signature/position analysis of the ~20.3 MB inlined plan JS:\n+\n+| Contributor | Approx weight in plan JS | Notes |\n+|---|---|---|\n+| **Shiki TextMate grammars** (via `@pierre/diffs` → shiki) | **~8.2 MB across 143 `JSON.parse()` calls** | Present in **both** bundles. Reached via `CodeFilePopout` (`App.tsx:87`). Likely the single dominant parse cost. |\n+| **Mermaid** (diagram rendering, eager) | **~5.2–7.3 MB (~37% of plan JS)** | Non-minified diagram chunks + its own bundled katex chunk (276 KB). Statically reachable from `Viewer.tsx:41`; loaded even when a plan has zero diagrams. |\n+| highlight.js (full, 156 languages) | marker span ~6.4 MB (overlaps other ranges) | Full language set; `hljs` 99 hits. |\n+| **xterm / @plannotator/webtui** (agent terminal) | ~225 KB inlined marker span (source footprint ~4.7 MB) | **Dead weight on plan review** — terminal is annotate-only (#941). Real `xterm-viewport/-screen/-accessibility` classes present in `index.html`, absent from `review.html`. |\n+| CodeMirror 6 / `@plannotator/markdown-editor` | smaller | Used by plan direct-edit (#928) and annotate; **not** plan-removable. |\n+| Base64 fonts (fontsource) | ~2.0 MB decoded, 36 blobs | Inlined into JS. |\n+| katex | 11 hits | Rides in transitively (the standalone KaTeX PR #878 is not in this release). |\n+| marked, DOMPurify, web-highlighter, lucide | smaller | — |\n+\n+Plan-vs-review JS delta ≈ **5.4–5.7 MB**, attributable to xterm/webtui + CodeMirror + highlight.js. The ~8.2 MB Shiki grammars and most of Mermaid are common to both.\n+\n+---\n+\n+## Verified feasibility anchors (for the optimization spike)\n+\n+- **The exact plan editor already builds multi-asset.** `apps/portal/index.tsx` imports the same `@plannotator/editor` (`packages/editor/App.tsx`) and `apps/portal/vite.config.ts` does **not** use `viteSingleFile`/`inlineDynamicImports`/`assetsInlineLimit`. The portal is a working proof that this App can ship as normal chunked assets.\n+- **`Bun.embeddedFiles` is a real API** (`typeof Bun.embeddedFiles === 'object'`), so a multi-asset `dist/` tree can be embedded into the compiled binary instead of a single string.\n+\n+---\n+\n+## Why single-file-inline exists (the invariants any change must respect)\n+\n+- **No runtime build step / no node_modules at runtime** — the compiled standalone binary must carry the whole UI.\n+- **Random ephemeral port per invocation** — solves concurrent-session port collisions (`index.ts:592-603` EADDRINUSE handling); but it is the reason caching never helps locally.\n+- **URL-hash sharing** of plans/annotations (`packages/ui/utils/sharing.ts`) and the **backendless share portal** (`apps/portal`) — expect a self-contained document and must degrade with no `/api/*` backend.\n+- **Offline / air-gapped operation** — assets cannot be CDN-hosted; they must stay embedded/local.\n+- **Three runtimes** (binary / OpenCode npm / Pi npm) — any embedding+serving change must replicate across all three.\n+\n+---\n+\n+## Open questions carried into the optimization spike\n+\n+1. Actual cold-load parse/execute attribution on #926's hardware (macOS/Chrome): how much is the 143 Shiki `JSON.parse` calls vs. Mermaid eager init vs. xterm/CodeMirror vs. React mount? The plan rests on Shiki+Mermaid being dominant — confirm with a flame chart.\n+2. Does Chrome's V8 reuse compiled-bytecode cache for content-hashed, `immutable`-cached assets across tab loads on a **stable** origin? The repeat-load payoff depends on this.\n+3. Can the 143 Shiki grammars be subset or lazy-loaded **independently** of the single-file question (possibly an invariant-safe large win)?\n+4. Does a multi-asset editor build run correctly in the **backendless portal** with lazy chunks served as static files, and still degrade when `/api/*` is absent?\ndiff --git a/adr/research/SPIKE-bundle-optimization-theories-20260619-154926.md b/adr/research/SPIKE-bundle-optimization-theories-20260619-154926.md\nnew file mode 100644\nindex 00000000..7924ef04\n--- /dev/null\n+++ b/adr/research/SPIKE-bundle-optimization-theories-20260619-154926.md\n@@ -0,0 +1,93 @@\n+# SPIKE: Bundle optimization theories — killing the 5s plan load\n+\n+Date: 2026-06-19\n+Status: Research (read-only). No code changed.\n+Companion: `SPIKE-bundle-build-and-serve-architecture-20260619-154926.md` (the factual map).\n+Driver: issue #926 — plan HTML page blank/loading ~5s **every** open (Pi user, macOS/Chrome).\n+\n+---\n+\n+## Root cause (one line)\n+\n+Every plan open serves a ~21 MB HTML (~20.3 MB inlined JS) on a **new random port** with **no cache headers**, parsing everything up front because `viteSingleFile + inlineDynamicImports` forbid code-splitting. New origin per run = cold V8/disk cache every time. **Parse/execute, not network, is the cost.**\n+\n+There are two independent levers:\n+- **Cut the JS** (less to parse) — partially cheap.\n+- **Stabilize the origin** (let the cache survive) — hard, but it's the only thing that kills \"every time.\"\n+\n+A fix for #926 needs both. They can ship in sequence.\n+\n+---\n+\n+## Theories, traced and ranked\n+\n+### 1. Dependency-level trimming — `verdict: do it, but it won't fix #926` (low impact / very-low effort / ~zero risk)\n+The only invariant-safe, today-mergeable change in the set. Swap `highlight.js` → `highlight.js/lib/common` (4 import lines: `Viewer.tsx:3`, `InlineMarkdown.tsx:3`, `blocks/CodeBlock.tsx:2`, `review-editor/HighlightedCode.tsx:2`) drops 156 languages (~370 KB minified). Honest impact is sub-perceptual in isolation (~1.8% of JS), but it removes real bytes inside the single-file model with no architectural risk. The natural first commit of a \"shrink the bundle\" campaign — not a solution on its own.\n+\n+### 2. Multi-asset + cached
