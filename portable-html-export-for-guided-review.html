  <script id="plannotator-guided-review-snapshot" type="application/json">{"kind":"plannotator-guided-review","version":1,"exportedAt":"2026-07-10T20:53:56.165Z","guide":{"title":"Portable HTML export for Guided Review","intent":"Organize the current changeset (guided-review portable HTML export feature plus unrelated housekeeping) into a guided review","sections":[{"title":"Portable snapshot contract and static HTML generator","overview":"`packages/shared/guide-export.ts` is the new core of this feature: it defines the versioned `PortableGuidedReviewSnapshotV1` contract (guide data + the exact review patch/diffType/base it was generated against + optional repo/generator metadata), a strict recursive parser that rejects unknown fields and enforces size caps (`MAX_RAW_PATCH_CHARS`, `MAX_GUIDE_SECTIONS`, `MAX_GUIDE_DIFF_REFS`), and `createPortableGuidedReviewHtml`, which renders a small bootstrap HTML document embedding the snapshot as an inert JSON `\u003cscript\u003e` tag and pointing `\u003cscript\u003e`/`\u003clink\u003e` tags at a versioned, CDN-hosted production viewer bundle (`PLANNOTATOR_GUIDED_REVIEW_ASSET_URL`, default `plannotator.ai/assets/guided-review-viewer/v1/`). This keeps exported files small (diff + JSON only, no bundled UI code) while reusing the exact same production viewer everyone else sees. **The HTML sets a strict CSP scoping scripts/styles/fonts to the asset origin and blocking all network/worker access**, since the file may be opened untrusted from disk or shared externally. `getPortableGuidedReviewExportInfo`/`snapshotForExport` implement an opt-in large-file policy: any single file patch over 1MB is flagged, and callers can choose to exclude those patches (keeping the file's name and guide summary but dropping its diff body) to bound export size. `packages/shared/guide-export.test.ts` covers parsing edge cases and the size-limit gate. This is the piece everything else in the changeset builds on.","diffs":[{"file":"packages/shared/guide-export.ts","summary":"New module: snapshot contract, strict parser, HTML bootstrap generator, and large-file export-size policy."},{"file":"packages/shared/guide-export.test.ts","summary":"New tests for parsing the portable snapshot contract and the large-file size-limit gate."},{"file":"packages/shared/package.json","summary":"Adds the `./guide-export` subpath export so the module can be imported as `@plannotator/shared/guide-export`."}]},{"title":"Server: pairing a guide with its launch snapshot and serving the export","overview":"A generated guide previously only remembered the changed-file list used at generation time; it now also captures the exact `GuideLaunchSnapshot` (raw patch, git ref, diffType, base, repository/PR metadata) at the moment `buildCommand` is invoked, keyed by the job's `jobId`. This required threading `jobId` and the pre-built snapshot into `AgentJobHandlerOptions.buildCommand` (previously `(provider, config)`, now `(provider, config, { jobId })`) so the job id is known before the async command build completes, in both the Bun (`packages/server`) and Pi (`apps/pi-extension/server`) implementations. `guide-review.ts` adds `launchSnapshots: Map\u003cjobId, GuideLaunchSnapshot\u003e` and `getExportArtifact(jobId)`, which pairs a completed guide with its immutable launch snapshot and the persisted per-section reviewed state; repaired guides reuse the *original* job's snapshot rather than whatever diff happens to be on screen at repair time. Both `review.ts` and `serverReview.ts` add matching `GET /api/guide/:jobId/export-info` and `/export` routes: export-info returns the large-file preflight, export builds the `PortableGuidedReviewSnapshotV1` from the artifact and streams back `createPortableGuidedReviewHtml(...)` as a file download, returning 409 with the preflight info if large files exist and no explicit `largeFiles=include|exclude` choice was passed. This is the second most important piece: it guarantees an exported guide always describes the diff it was actually generated from, never a diff that has since drifted.","diffs":[{"file":"packages/server/guide/guide-review.ts","summary":"Adds GuideLaunchSnapshot/GuideExportArtifact types, launchSnapshots map, and getLaunchSnapshot/getExportArtifact; buildCommand now takes and stores jobId + launchSnapshot."},{"file":"packages/server/guide/guide-review.test.ts","summary":"New test verifying a completed guide is paired with the exact launch-time review snapshot via getExportArtifact."},{"file":"packages/server/review.ts","summary":"Snapshots gitRef alongside patch/diffType/base at launch, builds the guide launch snapshot (reusing the original on repair), and adds the export-info/export GET routes."},{"file":"packages/server/agent-jobs.ts","summary":"buildCommand signature gains a third `{ jobId }` context argument, passed through when launching an agent job."},{"file":"apps/pi-extension/server/serverReview.ts","summary":"Mirrors the Bun server's launch-snapshot capture and export/export-info routes for the Pi runtime, importing the vendored guide-export module."},{"file":"apps/pi-extension/server/agent-jobs.ts","summary":"Mirrors the Bun buildCommand signature change to accept and forward `{ jobId }`."},{"file":"apps/pi-extension/vendor.sh","summary":"Adds guide-export to the list of shared modules vendored into the Pi extension's generated/ directory."}]},{"title":"Review app: rendering a portable snapshot standalone","overview":"The review app (`App.tsx`) now detects, on mount, whether the current page has an embedded portable guide snapshot (`readEmbeddedPortableGuidedReview(document)`, from the new `portableGuideSnapshot.ts`) rather than running against a live `/api/*` server. When one is present, the app skips the live diff fetch and AI-capability checks, seeds `diffData`/`files` directly from the snapshot's `review.rawPatch`, opens straight into the Guide screen, and disables update checks, first-run dialogs/spotlights, and any server-backed feature (file-content expansion, open-in-editor, AI). An `invalid` snapshot (failed parsing) renders a plain error screen instead of the app. `GuideScreen`/`GuideView`/`useGuideData` gained an `embedded` data source (`GuideDataSource = {kind:'job'} | {kind:'embedded', guide}`) so the guide renderer can display a fully pre-parsed guide with no job polling or reviewed-state persistence, and `DiffViewer`/`FileHeader` gained `fileContentFetchEnabled`/`canOpenFile` props threaded through `ReviewStateContext` to suppress server-only actions. **This is the part worth slowing down for**: it's the same production bundle serving two very different runtime modes (live server-backed review vs. static offline snapshot), and any code path that assumes a server exists needs one of these new guards or it will silently 404/hang in the portable build.","diffs":[{"file":"packages/review-editor/App.tsx","summary":"Detects an embedded portable snapshot on mount and short-circuits live-server data loading, dialogs, spotlights, AI capability checks, and update checks when present; renders an error screen for an invalid snapshot."},{"file":"packages/review-editor/portableGuideSnapshot.ts","summary":"New helper: reads and parses the inert JSON snapshot embedded by the export endpoint's `\u003cscript id=...\u003e` tag."},{"file":"packages/review-editor/portableGuideSnapshot.test.ts","summary":"New tests for the embedded-snapshot reader's absent/loaded/invalid outcomes."},{"file":"packages/review-editor/hooks/guide/useGuideData.ts","summary":"Adds the 'embedded' GuideDataSource variant, short-circuiting job fetch and reviewed-state persistence when a guide is passed in directly."},{"file":"packages/review-editor/components/guide/GuideScreen.tsx","summary":"Threads embeddedGuide/embeddedEngineLabel/htmlExportEnabled props down to ActiveGuide and useGuideData."},{"file":"packages/review-editor/components/guide/GuideView.tsx","summary":"Accepts an optional exportJobId and renders the new GuideShareMenu next to the guide header when present."},{"file":"packages/review-editor/components/guide/GuideDiffSection.tsx","summary":"Passes fileContentFetchEnabled/canOpenFile through from review state into DiffViewer."},{"file":"packages/review-editor/dock/ReviewStateContext.tsx","summary":"Adds fileContentFetchEnabled/canOpenFiles fields to the shared review state type."},{"file":"packages/review-editor/components/DiffViewer.tsx","summary":"Skips the server file-content fetch and disables open-in-editor when fileContentFetchEnabled/canOpenFile are false."},{"file":"packages/review-editor/components/FileHeader.tsx","summary":"Gates the open-in-editor control on the new canOpenFile prop."},{"file":"packages/ui/components/OpenInAppButton.tsx","summary":"Skips loading available apps and clears state when canOpen is false, avoiding a server call in offline mode."},{"file":"packages/ui/hooks/useUpdateCheck.ts","summary":"Adds an `{ enabled }` option so the offline portable viewer can opt out of the GitHub release check."},{"file":"packages/review-editor/components/guide/GuideShareMenu.tsx","summary":"New share/download menu on the guide header: preflights export size via export-info, prompts for an include/exclude choice when large files are present, and triggers the HTML download."}]},{"title":"Portable build pipeline and worker-pool split","overview":"Exported HTML files need to load the review UI from a static CDN bundle instead of the developer/production single-file build, so this adds a dedicated Vite entry point and build target. `apps/review/portable.tsx` mounts the same `App` component but deliberately omits the syntax-highlighting worker-pool provider (workers can't spawn reliably from a `file://` context), and `apps/review/vite.portable.config.ts` builds it as an IIFE (`viewer.js`/`viewer.css`) into `apps/marketing/dist/assets/guided-review-viewer/v1/`, the exact path the exported HTML's asset URLs point at. To support omitting the provider without duplicating the two worker-pool hooks (`useIsWorkerPoolReadyOrDisabled`, `useWorkerPoolThemeSync`), those hooks were extracted out of `workerPool.tsx` into a new `workerPoolRuntime.ts` that doesn't import the provider component; `workerPool.tsx` now just re-exports them alongside the provider. `build:marketing` now also runs `build:portable` so the viewer assets ship with the marketing site deploy.","diffs":[{"file":"apps/review/portable.tsx","summary":"New entry point mounting App without the worker-pool provider for the portable/offline build."},{"file":"apps/review/vite.portable.config.ts","summary":"New Vite config building the portable entry as an IIFE bundle into the marketing site's static asset path."},{"file":"apps/review/package.json","summary":"Adds the build:portable script wired to vite.portable.config.ts."},{"file":"package.json","summary":"build:marketing now also runs apps/review's build:portable so the viewer bundle deploys with the marketing site."},{"file":"packages/review-editor/workerPool.tsx","summary":"Worker-ready and theme-sync hooks moved out to workerPoolRuntime.ts; this file now only owns ReviewWorkerPoolProvider and re-exports the hooks."},{"file":"packages/review-editor/workerPoolRuntime.ts","summary":"New module: the extracted useIsWorkerPoolReadyOrDisabled/useWorkerPoolThemeSync hooks, importable without pulling in the provider."},{"file":"packages/review-editor/components/AllFilesCodeView.tsx","summary":"Updates the worker-pool hook import to the new workerPoolRuntime module."}]},{"title":"Docs and generated export samples","overview":"Documentation updates covering the new endpoints, plus two generated `.html` export files checked in as ad hoc smoke-test artifacts of this feature.","diffs":[{"file":"AGENTS.md","summary":"Documents PLANNOTATOR_GUIDED_REVIEW_ASSET_URL and the two new guide export endpoints."},{"file":"apps/marketing/src/content/docs/commands/code-review.md","summary":"Documents the export-info/export endpoints in the marketing docs API reference."},{"file":"guided-review-portable-html-export.html","summary":"Generated sample output of the new portable export endpoint (large, not hand-authored)."},{"file":"portable-guided-review-html-export.html","summary":"Second generated sample export, likely from an earlier iteration of the feature."}]},{"title":"Housekeeping and unrelated artifacts","overview":"Everything here is unrelated to the guided-review export feature: version-bump release notes, example/spike architecture-decision docs, and standalone dev-ops scripts. None of it touches the export code path.","diffs":[{"file":"RELEASE_NOTES_v0.20.0.md","summary":"Release notes for a prior version bump."},{"file":"RELEASE_NOTES_v0.20.1.md","summary":"Release notes for a prior version bump."},{"file":"RELEASE_NOTES_v0.20.2.md","summary":"Release notes for a prior version bump."},{"file":"RELEASE_NOTES_v0.20.3.md","summary":"Release notes for a prior version bump."},{"file":"RELEASE_NOTES_v0.21.0.md","summary":"Release notes for a prior version bump."},{"file":"RELEASE_NOTES_v0.21.1.md","summary":"Release notes for a prior version bump."},{"file":"RELEASE_NOTES_v0.21.2.md","summary":"Release notes for a prior version bump."},{"file":"RELEASE_NOTES_v0.21.3.md","summary":"Release notes for a prior version bump."},{"file":"RELEASE_NOTES_v0.21.4.md","summary":"Release notes for a prior version bump."},{"file":"RELEASE_NOTES_v0.22.0.md","summary":"Release notes for a prior version bump."},{"file":"RELEASE_NOTES_v0.23.0.md","summary":"Release notes for a prior version bump."},{"file":"adr/0003-example-architecture-decision.md","summary":"New template/example ADR document; not a binding decision."},{"file":"adr/research/SPIKE-bundle-build-and-serve-architecture-20260619-154926.md","summary":"Read-only research spike documenting the current UI bundle build/serve architecture (issue #926 investigation)."},{"file":"adr/research/SPIKE-bundle-optimization-theories-20260619-154926.md","summary":"Read-only companion spike proposing bundle-size/load-time optimization theories."},{"file":"scripts/local-smoke-test.sh","summary":"New large standalone smoke-test script for local install verification, unrelated to this feature's code paths."},{"file":"scripts/plannotator-inventory.sh","summary":"New read-only script that inventories the local Plannotator install footprint across agent integrations."}]}],"reviewed":[false,false,false,false,false,false]},"review":{"rawPatch":"diff --git a/AGENTS.md b/AGENTS.md\nindex 5063b1ff..e3c2c3fe 100644\n--- a/AGENTS.md\n+++ b/AGENTS.md\n@@ -136,6 +136,7 @@ claude --plugin-dir ./apps/hook\n | `PLANNOTATOR_SHARE` | Set to `disabled` to turn off URL sharing entirely. Default: enabled. Can also be set via `~/.plannotator/config.json` (`{ \"share\": \"disabled\" }`); the env var takes precedence. |\n | `PLANNOTATOR_SHARE_URL` | Custom base URL for share links (self-hosted portal). Default: `https://share.plannotator.ai`. |\n | `PLANNOTATOR_PASTE_URL` | Base URL of the paste service API for short URL sharing. Default: `https://plannotator-paste.plannotator.workers.dev`. |\n+| `PLANNOTATOR_GUIDED_REVIEW_ASSET_URL` | Base URL for the versioned production Guided Review viewer assets used by downloaded HTML exports. Default: `https://plannotator.ai/assets/guided-review-viewer/v1/`. Primarily useful for local viewer development or self-hosting. |\n | `PLANNOTATOR_ORIGIN` | Explicit agent-origin override at the top of the detection chain. Valid values: `claude-code`, `amp`, `droid`, `opencode`, `codex`, `copilot-cli`, `gemini-cli`, `kiro-cli`, `pi`. Invalid values silently fall through to env-based detection. Unset by default. |\n | `PLANNOTATOR_JINA` | Set to `0` / `false` to disable Jina Reader for URL annotation, or `1` / `true` to enable. Default: enabled. Can also be set via `~/.plannotator/config.json` (`{ \"jina\": false }`) or per-invocation via `--no-jina`. |\n | `PLANNOTATOR_ANNOTATE_HISTORY` | Set to `0` / `false` to disable per-file version history in a \u003e\n+\u003csummary\u003e\u003cstrong\u003eMissed recent releases?\u003c/strong\u003e\u003c/summary\u003e\n+\n+| Release                                                                      | Highlights                                                                                                                       |\n+| ---------------------------------------------------------------------------- | -------------------------------------------------------------------------------------------------------------------------------- |\n+| [v0.19.27](https://github.com/backnotprop/plannotator/releases/tag/v0.19.27) | Kiro CLI integration, Glimpse native window, annotate-last message picker                                                        |\n+| [v0.19.26](https://github.com/backnotprop/plannotator/releases/tag/v0.19.26) | Amp plugin production fixes, Mermaid rendering fix, Settings flicker fix, update notification toast and shimmer                   |\n+| [v0.19.24](https://github.com/backnotprop/plannotator/releases/tag/v0.19.24) | Amp integration, configurable data directory, Auto Mode permission option, Pi plan approval fix                                  |\n+| [v0.19.23](https://github.com/backnotprop/plannotator/releases/tag/v0.19.23) | Droid integration, Windows Pi AI fix, quieter update indicator                                                                   |\n+| [v0.19.22](https://github.com/backnotprop/plannotator/releases/tag/v0.19.22) | Safari copy fix in plan viewer, CLAUDE_CONFIG_DIR support for session logs                                                       |\n+| [v0.19.21](https://github.com/backnotprop/plannotator/releases/tag/v0.19.21) | Ask AI in plan review and annotate mode, shared AI runtime, origin-aware provider defaults                                       |\n+| [v0.19.20](https://github.com/backnotprop/plannotator/releases/tag/v0.19.20) | Interactive goal setup UI, OpenCode submit_plan fixes, browser no-op sentinel handling for Claude agents                         |\n+| [v0.19.18](https://github.com/backnotprop/plannotator/releases/tag/v0.19.18) | Edit-based submit_plan for OpenCode, Pi namespace migration, Codex annotate-last fix, OpenCode commands dir fix                  |\n+| [v0.19.17](https://github.com/backnotprop/plannotator/releases/tag/v0.19.17) | Reworked goal setup skill (interview-driven flow), CLI --version flag                                                            |\n+| [v0.19.16](https://github.com/backnotprop/plannotator/releases/tag/v0.19.16) | Code navigation with peek view (Cmd/Ctrl+click tokens in diffs)                                                                 |\n+| [v0.19.15](https://github.com/backnotprop/plannotator/releases/tag/v0.19.15) | Commit-based diff base, jj evolution diffs, GitLab reliability fixes, OpenCode command intercept fix                             |\n+\n+\u003cem\u003eAWESOME\u003c/em\u003e\n+\n+\u003c/details\u003e\n+\n+---\n+\n+## What's New in v0.20.0\n+\n+v0.20.0 is the largest release in a while: 11 PRs, three of them from first-time contributors. Code review gains multi-repo workspace support and a semantic diff overview. The interface gets a full visual refresh with two new themes, a grid-versus-flat plan look, and a full-page HTML annotation mode. Under the hood, the way skills and commands install has been rationalized so each artifact has a single source of truth and a default install ships lean. Several reliability fixes round it out across OpenCode, Pi, Windows, and GitLab.\n+\n+---\n+\n+\u003e [!IMPORTANT]\n+\u003e **v0.20.0 is a large release, and two of its changes affect existing installs. Please read these before you upgrade.**\n+\u003e\n+\u003e **1. Extra skills are no longer installed by default.** The `plannotator-compound`, `plannotator-setup-goal`, and `plannotator-visual-explainer` skills used to ship with every install. They now install separately, so a default install stays lean. To add them:\n+\u003e ```bash\n+\u003e npx skills add backnotprop/plannotator/apps/skills/extra\n+\u003e ```\n+\u003e When you upgrade, the installer performs a one-time cleanup that removes the old default-installed copies of these three skills from `~/.claude/skills` and `~/.agents/skills`. If you want them, reinstall with the command above. Copies you install yourself with `npx skills add` are never touched again. (Kiro CLI is the exception and keeps receiving setup-goal and visual-explainer.)\n+\u003e\n+\u003e **2. On Claude Code, the slash commands are now skills.** Claude Code merged custom commands into skills, so Plannotator follows suit. `/plannotator-review`, `/plannotator-annotate`, and `/plannotator-last` are now installed as Claude Code skills under `~/.claude/skills` (same names, same behavior). The old `~/.claude/commands/plannotator-*.md` files are removed automatically on upgrade. The standalone `/plannotator-status` and `/plannotator-archive` commands are gone: plan archive browsing now lives in a sidebar tab during plan review. If you use the marketplace plugin, run `/plugin marketplace update` once so the old namespaced `plannotator:*` entries disappear from the `/` menu.\n+\u003e\n+\u003e If git is missing or a fetch is blocked, the installer now stops with a clear message instead of silently leaving you half-installed. git is required.\n+\n+---\n+\n+### Multi-Repo Workspace Reviews\n+\n+Code review previously required a git repository as the working directory. Teams working across several services in a parent folder had no way to review them together: each repo needed its own session, and feedback was fragmented.\n+\n+You can now run `plannotator review` from a non-git parent directory that contains multiple repositories. Plannotator discovers the nested repos that have local changes, pre-selects them, and presents a single review session covering all of them. Diff switching, file-content lookups, staging, and agent operations are all repo-aware, and the review feedback covers every repo in one pass. The single-repo workflow is unchanged: the workspace flow only engages when the directory you start from is not itself a repository.\n+\n+- [#543](https://github.com/backnotprop/plannotator/pull/543) closing [#527](https://github.com/backnotprop/plannotator/issues/527), contributed by @Oscar-Silva\n+\n+### Semantic Diff Overview\n+\n+Code review now opens to a semantic diff overview that groups changes by what was modified rather than only by which lines moved. It runs the `sem` analyzer over the active patch and shows the result as the default landing panel, with a sidebar entry above All Files, rows for binary changes, inline error reporting, and retry.\n+\n+The analyzer ships as an optional sidecar that the installers fetch without blocking the rest of the install, and the overview is available in both the Bun-based servers (Claude Code, OpenCode) and the Pi extension's Node server. When the sidecar is unavailable, review falls back cleanly to the standard diff view.\n+\n+- [#871](https://github.com/backnotprop/plannotator/pull/871), contributed by @backnotprop\n+\n+### UI 2.0: New Themes, Plan Look Chooser, and Full-Page HTML Annotation\n+\n+The interface received a broad visual refresh. Two new themes, Simple and Neutral, join the existing set, built on a refreshed design-system token bridge. The overlay scrollbar library was removed in favor of native scrolling, which is lighter and more accessible.\n+\n+Plan rendering now offers two looks. Grid keeps your plan as a floating card on grid paper; Clean is a simpler, edge-to-edge flat card. A first-run dialog announces the release and lets you pick. The release announcement also surfaces what is new in the release and links to the full notes.\n+\n+Annotation gains a full-page HTML mode. Running `plannotator annotate --render-html` opens an HTML report or explainer rendered edge-to-edge in a sandboxed frame, themed to match Plannotator, and lets you annotate it directly with text selection or by clicking an element, instead of flattening it to markdown first. This pairs naturally with the visual-explainer skill's HTML output.\n+\n+- [#863](https://github.com/backnotprop/plannotator/pull/863) and [#879](https://github.com/backnotprop/plannotator/pull/879), contributed by @backnotprop\n+\n+### Leaner Install and Single-Source Skills\n+\n+The way Plannotator ships skills and commands was restructured so each artifact has exactly one authoritative source. Core skills (review, annotate, last) install from a single location to both `~/.claude/skills` and Codex's `~/.agents/skills`. The extra skills move to opt-in installation via `npx skills add` (see the note at the top of these release notes). Every installer's hard-coded command and skill text was removed in favor of copying the real files from the repository, which eliminates a class of cross-platform escaping bugs.\n+\n+The installers also became stricter and safer to re-run. git is now a hard requirement, and a missing git or a failed fetch stops the install with an actionable message rather than silently skipping steps. Cleanup of legacy command files and stale Codex skills only happens after the replacement skill is on disk, so no upgrade path can leave you with neither. A one-time migration ledger tracks the extras cleanup so re-running the installer never re-removes skills you reinstalled yourself.\n+\n+First-run interactive installs ask whether to add the extra skills and whether to make any skills model-invocable, and the answers are saved and reused on later runs. Automated and piped installs never prompt and keep the safe defaults.\n+\n+- [#850](https://github.com/backnotprop/plannotator/pull/850) closing [#516](https://github.com/backnotprop/plannotator/issues/516), [#817](https://github.com/backnotprop/plannotator/issues/817), [#823](https://github.com/backnotprop/plannotator/issues/823), [#842](https://github.com/backnotprop/plannotator/issues/842), [#852](https://github.com/backnotprop/plannotator/issues/852), and [#853](https://github.com/backnotprop/plannotator/issues/853); follow-ups in [#872](https://github.com/backnotprop/plannotator/pull/872) and [#873](https://github.com/backnotprop/plannotator/pull/873), contributed by @backnotprop\n+\n+### Expand Unchanged Regions by Default\n+\n+Code review gains a persistent setting to expand unchanged diff regions by default. With it enabled, changed files open with their surrounding context already unfolded instead of requiring manual clicks. The toggle is available from both the main review display settings and the compact diff options popover, and it persists across sessions.\n+\n+- [#858](https://github.com/backnotprop/plannotator/pull/858) closing [#857](https://github.com/backnotprop/plannotator/issues/857), contributed by @Perlten\n+\n+### OpenCode Runtime Compatibility\n+\n+The OpenCode plugin was split into a portable entry point and a Bun-only embedded runtime, so Node-hosted OpenCode no longer imports Bun server code at load time. On Bun hosts the plugin runs its full embedded runtime; on Node hosts it falls back gracefully to the installed Plannotator CLI. The fix restores agent switching, the recent-message picker for `plannotator last`, share disabling, and PR review semantics through the CLI bridge, and hardens sandboxed OpenCode startup so it uses a private port instead of attaching to an unrelated server.\n+\n+- [#849](https://github.com/backnotprop/plannotator/pull/849) closing [#596](https://github.com/backnotprop/plannotator/issues/596), [#681](https://github.com/backnotprop/plannotator/issues/681), and [#847](https://github.com/backnotprop/plannotator/issues/847), contributed by @backnotprop\n+\n+### Glimpse Native Window on Windows\n+\n+On Windows, Glimpse never launched: npm installs `glimpseui` only as script shims with no native executable, so the plain spawn always failed and Plannotator fell back to a browser tab. The server now detects this case and launches Glimpse by running its package entry point directly with `node`, which keeps the HTML stdin pipe intact. Non-Windows hosts are unaffected.\n+\n+- [#861](https://github.com/backnotprop/plannotator/pull/861) closing [#860](https://github.com/backnotprop/plannotator/issues/860), contributed by @NikiforovAll\n+\n+### Additional Changes\n+\n+- **Windows install prompt timeout and OpenCode cleanup.** The PowerShell installer's first-run prompts no longer hang indefinitely without a terminal, and a stale OpenCode archive command stub is swept on upgrade. [#875](https://github.com/backnotprop/plannotator/pull/875)\n+- **GitLab merge request review reliability.** GitLab MR review keeps the raw-diffs endpoint as primary and falls back to the paginated diffs endpoint when it is empty or fails, with a clear error when a merge request genuinely has no diff. (in [#879](https://github.com/backnotprop/plannotator/pull/879))\n+- **Claude Fable 5 model option.** Fable 5 was added to the code review and Ask AI model selectors alongside Opus 4.8.\n+\n+## Install / Update\n+\n+**macOS / Linux:**\n+\n+```bash\n+curl -fsSL https://plannotator.ai/install.sh | bash\n+```\n+\n+**Windows:**\n+\n+```powershell\n+irm https://plannotator.ai/install.ps1 | iex\n+```\n+\n+**Extra skills** (compound, setup-goal, visual-explainer), now opt-in:\n+\n+```bash\n+npx skills add backnotprop/plannotator/apps/skills/extra\n+```\n+\n+**Claude Code Plugin:** Run `/plugin` in Claude Code, find **plannotator**, and click **\"Update now\"**. Then run `/plugin marketplace update` once to clear the old namespaced command entries.\n+\n+**OpenCode:** Clear cache and restart:\n+\n+```bash\n+rm -rf ~/.bun/install/cache/@plannotator\n+```\n+\n+Then in `opencode.json`:\n+\n+```json\n+{\n+  \"plugin\": [\"@plannotator/opencode@latest\"]\n+}\n+```\n+\n+**Pi:** Install or update the extension:\n+\n+```bash\n+pi install npm:@plannotator/pi-extension\n+```\n+\n+**Droid:** Install via the plugin marketplace:\n+\n+```\n+droid plugin marketplace add backnotprop/plannotator\n+droid plugin install plannotator@plannotator\n+```\n+\n+**Amp:** Install the CLI first, then copy the plugin:\n+\n+```bash\n+mkdir -p ~/.config/amp/plugins\n+curl -fsSL https://raw.githubusercontent.com/backnotprop/plannotator/main/apps/amp-plugin/plannotator.ts \\\n+  -o ~/.config/amp/plugins/plannotator.ts\n+```\n+\n+**Kiro CLI:** The installer auto-detects Kiro and installs skills automatically. After installing the CLI, launch with:\n+\n+```bash\n+kiro-cli chat --agent plannotator\n+```\n+\n+---\n+\n+## What's Changed\n+\n+- feat(review): support multi-repo workspace reviews by @Oscar-Silva in [#543](https://github.com/backnotprop/plannotator/pull/543)\n+- Fix OpenCode plugin runtime compatibility by @backnotprop in [#849](https://github.com/backnotprop/plannotator/pull/849)\n+- Single-source skills (core/extra), replace Claude Code commands with skills, de-hardcode installers by @backnotprop in [#850](https://github.com/backnotprop/plannotator/pull/850)\n+- Add persistent full-file diff context setting by @Perlten in [#858](https://github.com/backnotprop/plannotator/pull/858)\n+- fix(server): launch Glimpse via node on Windows instead of unspawnable npm shim by @NikiforovAll in [#861](https://github.com/backnotprop/plannotator/pull/861)\n+- UI 2.0 visual refresh by @backnotprop in [#863](https://github.com/backnotprop/plannotator/pull/863)\n+- feat(review): add semantic diff overview by @backnotprop in [#871](https://github.com/backnotprop/plannotator/pull/871)\n+- fix(install): restore /plannotator-* bash execution on Claude Code and harden unattended installs by @backnotprop in [#872](https://github.com/backnotprop/plannotator/pull/872)\n+- chore: remove the redundant /plannotator-status and /plannotator-archive commands by @backnotprop in [#873](https://github.com/backnotprop/plannotator/pull/873)\n+- fix(install): Windows prompt timeout and stale OpenCode archive stub sweep by @backnotprop in [#875](https://github.com/backnotprop/plannotator/pull/875)\n+- feat(plan): grid-default plan look chooser and 0.20.0 release dialog, with GitLab, sem, and install fixes by @backnotprop in [#879](https://github.com/backnotprop/plannotator/pull/879)\n+- feat(review): add Claude Fable 5 to the model selectors by @backnotprop\n+\n+## New Contributors\n+\n+- @Oscar-Silva made their first contribution in [#543](https://github.com/backnotprop/plannotator/pull/543)\n+- @Perlten made their first contribution in [#858](https://github.com/backnotprop/plannotator/pull/858)\n+- @NikiforovAll made their first contribution in [#861](https://github.com/backnotprop/plannotator/pull/861)\n+\n+## Contributors\n+\n+@Oscar-Silva built multi-repo workspace review, adding repo discovery from a non-git parent directory and making diff switching, file-content lookups, staging, and agent routing repo-aware, with regression coverage for the new workspace paths. @Perlten contributed the persistent full-file diff context setting, wiring it through server config and both the single-file and all-files diff views, and also reported the original request. @NikiforovAll diagnosed and fixed the Windows Glimpse launch failure, tracing it to npm's script-shim packaging and switching to a direct `node` spawn that preserves the stdin pipe, and reported the underlying issue with a clear reproduction table.\n+\n+This release also resolved a number of community-reported issues. @daviziks requested multi-repo review support for poly-repo workflows. @possiblyneal asked for a way to hide legacy alias skill names from the Claude skill list. @stefanbinoj raised loading skills into the system prompt by default. @cwardgar reported that Plannotator did not respect `CODEX_HOME`. @robsonpeixoto reported the marketplace plugin not installing the compound skill. @mactavishz, @boris-gorbylev, and @matteo9924 reported the OpenCode plugin load and runtime failures that the runtime split resolves.\n+\n+**Full Changelog**: https://github.com/backnotprop/plannotator/compare/v0.19.27...v0.20.0\ndiff --git a/RELEASE_NOTES_v0.20.1.md b/RELEASE_NOTES_v0.20.1.md\nnew file mode 100644\nindex 00000000..af77e540\n--- /dev/null\n+++ b/RELEASE_NOTES_v0.20.1.md\n@@ -0,0 +1,53 @@\n+Follow [@plannotator](https://x.com/plannotator) on X for updates\n+\n+---\n+\n+## What's New in v0.20.1\n+\n+A hotfix for Pi extension installs. If `pi install npm:@plannotator/pi-extension` failed for you today, this release fixes it.\n+\n+### Pi Extension Install Failure\n+\n+Fresh installs of `@plannotator/pi-extension` started failing with an npm 404. The cause was upstream: our diff renderer dependency `@pierre/diffs` published a new 1.2.x line that depends on `@pierre/theming@0.0.1`, a package that does not exist on the npm registry. Plannotator declared the dependency with a loose `^1.1.12` range, so fresh installs floated onto the broken 1.2.9 and failed before Pi could finish loading extensions. Repo builds never saw it because the lockfile pinned an older version.\n+\n+The fix pins `@pierre/diffs` to exact `1.1.20` everywhere, whose dependency tree fully resolves. Update with:\n+\n+```bash\n+pi install npm:@plannotator/pi-extension\n+```\n+\n+- closing [#880](https://github.com/backnotprop/plannotator/issues/880)\n+\n+## Install / Update\n+\n+**macOS / Linux:**\n+\n+```bash\n+curl -fsSL https://plannotator.ai/install.sh | bash\n+```\n+\n+**Windows:**\n+\n+```powershell\n+irm https://plannotator.ai/install.ps1 | iex\n+```\n+\n+**Pi:** Install or update the extension:\n+\n+```bash\n+pi install npm:@plannotator/pi-extension\n+```\n+\n+Upgrading from before v0.20.0? Read the [v0.20.0 release notes](https://github.com/backnotprop/plannotator/releases/tag/v0.20.0) first; that release changed how skills install.\n+\n+---\n+\n+## What's Changed\n+\n+- fix(deps): pin @pierre/diffs to exact 1.1.20 by @backnotprop\n+\n+## Community\n+\n+@ramarivera reported the install failure with a complete diagnosis of the broken dependency chain, down to the exact unpublished package. @MaksimZinovev and @archidemus confirmed the failure.\n+\n+**Full Changelog**: https://github.com/backnotprop/plannotator/compare/v0.20.0...v0.20.1\ndiff --git a/RELEASE_NOTES_v0.20.2.md b/RELEASE_NOTES_v0.20.2.md\nnew file mode 100644\nindex 00000000..71f8a1bb\n--- /dev/null\n+++ b/RELEASE_NOTES_v0.20.2.md\n@@ -0,0 +1,166 @@\n+Follow [@plannotator](https://x.com/plannotator) on X for updates\n+\n+---\n+\n+\u003cdetails\u003e\n+\u003csummary\u003e\u003cstrong\u003eMissed recent releases?\u003c/strong\u003e\u003c/summary\u003e\n+\n+| Release                                                                      | Highlights                                                                                                                       |\n+| ---------------------------------------------------------------------------- | -------------------------------------------------------------------------------------------------------------------------------- |\n+| [v0.20.1](https://github.com/backnotprop/plannotator/releases/tag/v0.20.1)   | Pi extension install hotfix (pinned `@pierre/diffs` after a broken upstream release)                                             |\n+| [v0.20.0](https://github.com/backnotprop/plannotator/releases/tag/v0.20.0)   | Multi-repo workspace reviews, semantic diff overview, UI 2.0 themes and plan look chooser, leaner single-source skill install   |\n+| [v0.19.27](https://github.com/backnotprop/plannotator/releases/tag/v0.19.27) | Kiro CLI integration, Glimpse native window, annotate-last message picker                                                        |\n+| [v0.19.26](https://github.com/backnotprop/plannotator/releases/tag/v0.19.26) | Amp plugin production fixes, Mermaid rendering fix, Settings flicker fix, update notification toast and shimmer                   |\n+| [v0.19.24](https://github.com/backnotprop/plannotator/releases/tag/v0.19.24) | Amp integration, configurable data directory, Auto Mode permission option, Pi plan approval fix                                  |\n+| [v0.19.23](https://github.com/backnotprop/plannotator/releases/tag/v0.19.23) | Droid integration, Windows Pi AI fix, quieter update indicator                                                                   |\n+| [v0.19.22](https://github.com/backnotprop/plannotator/releases/tag/v0.19.22) | Safari copy fix in plan viewer, CLAUDE_CONFIG_DIR support for session logs                                                       |\n+| [v0.19.21](https://github.com/backnotprop/plannotator/releases/tag/v0.19.21) | Ask AI in plan review and annotate mode, shared AI runtime, origin-aware provider defaults                                       |\n+| [v0.19.20](https://github.com/backnotprop/plannotator/releases/tag/v0.19.20) | Interactive goal setup UI, OpenCode submit_plan fixes, browser no-op sentinel handling for Claude agents                         |\n+| [v0.19.18](https://github.com/backnotprop/plannotator/releases/tag/v0.19.18) | Edit-based submit_plan for OpenCode, Pi namespace migration, Codex annotate-last fix, OpenCode commands dir fix                  |\n+| [v0.19.17](https://github.com/backnotprop/plannotator/releases/tag/v0.19.17) | Reworked goal setup skill (interview-driven flow), CLI --version flag                                                            |\n+\n+\u003c/details\u003e\n+\n+---\n+\n+## What's New in v0.20.2\n+\n+v0.20.2 is a code-review-heavy release of nine PRs, two of them from first-time contributors. The largest work rebuilds the all-files review view on Pierre's CodeView and adds a pipeline that keeps very large pull requests fast and complete instead of failing or rendering empty. Agent engine selection is unified across review and tour modes, the Pi extension gains a programmatic plan-mode control event, and several reliability fixes land across review cleanup, annotate error messaging, and markdown rendering.\n+\n+### All-Files Code Review on Pierre CodeView\n+\n+The all-files code review surface was rebuilt on Pierre's CodeView renderer, replacing the previous custom diff view and its lazy-mounting layer. The new foundation virtualizes large diffs, renders change-type status in file headers and the file tree, and presents renames as `old/path → new/path` rather than as a blank change. The annotation model, drafts, feedback export, and keyboard shortcuts carry over unchanged, so the way you review and send feedback is the same.\n+\n+- [#885](https://github.com/backnotprop/plannotator/pull/885), contributed by @backnotprop\n+\n+### Large Pull Request Pipeline, Instant-Open Checkout, and Scroll Performance\n+\n+Reviewing very large pull requests previously hit several walls: GitHub refused oversized diffs outright, the local checkout blocked the review from opening, and some files came back from the platform with no patch content and rendered as empty stubs. This release addresses all three.\n+\n+When a platform refuses an oversized diff, Plannotator now pages through the per-file API and stitches the result into a unified diff, so the review still loads. When the platform withholds per-file content on a truncated diff, an amber \"Partial diff · Load full diff\" notice offers to recompute the exact diff locally, and a staleness check surfaces a refresh prompt when the underlying files change mid-review. The `--local` checkout no longer blocks startup: the review server opens as soon as the platform diff arrives and the checkout warms in the background, with agent jobs, full-stack diff, and code navigation waiting on it only when they need real files.\n+\n+Scrolling the all-files view was also reworked. Syntax highlighting moved off the main thread into a worker pool, lazy full-content augmentation no longer hitches mid-scroll, and visibility tracking was coalesced to once per frame. The result is smoother scrolling on large diffs, with a clean fallback to unhighlighted text if the worker pool is unavailable.\n+\n+- [#893](https://github.com/backnotprop/plannotator/pull/893), contributed by @backnotprop\n+\n+### Unified Agent Mode Engine Selection\n+\n+The agent panel's engine selection was reworked so review and tour modes share one consistent model. Previously the selection conflated provider and mode in a single setting; it now separates the active mode from the engine choice (Claude or Codex) for each, with existing settings migrated forward. The change makes it clearer which engine runs for review versus tour and removes a class of confusing defaults.\n+\n+- [#868](https://github.com/backnotprop/plannotator/pull/868), contributed by @codythatsme\n+\n+### Programmatic Plan Mode for Pi\n+\n+The Pi extension gained a `plan-mode` event so other extensions and automation can drive Plannotator's plan mode programmatically. A request can enter, exit, toggle, or query plan mode, and receives the resulting phase (`idle`, `planning`, or `executing`) in return. This opens the plan workflow to scripted and multi-extension setups on Pi without requiring a manual command or shortcut.\n+\n+- [#898](https://github.com/backnotprop/plannotator/pull/898), contributed by @Termina1\n+\n+### Review Cleanup and PR Feedback Fixes\n+\n+Two reliability fixes for the review path. First, the standalone server now routes `SIGINT` and `SIGTERM` through its normal shutdown so the existing cleanup runs on interrupt or termination. Aborting a review while a large pull request was still checking out in the background previously left clone and fetch processes running and stale `git worktree` registrations behind; those are now cleaned up, with a second interrupt still forcing an immediate quit.\n+\n+Second, the review feedback sent to the agent on \"Send Feedback\" now includes the triage instruction (review the feedback, verify it against the code, and discuss before changing anything) for pull request reviews, not just local diffs. The instruction is appended whenever you send annotations and is correctly omitted for platform actions that post an approval or comment directly to the host. The behavior is consistent across Claude Code, OpenCode, and Pi.\n+\n+- [#914](https://github.com/backnotprop/plannotator/pull/914), contributed by @backnotprop\n+\n+### Clearer Annotate and Markdown Behavior\n+\n+Running `plannotator annotate` on a file type it does not support (for example a `.cs` or `.pdf` file) reported a misleading \"File not found\" even when the file was present. It now reports that the type is unsupported, lists the supported extensions, and points to `plannotator review` for code. Separately, custom angle-bracket autolinks are kept literal instead of having their contents parsed for markdown styling, so links that contain markdown-like characters render correctly.\n+\n+- [#870](https://github.com/backnotprop/plannotator/pull/870) closing [#757](https://github.com/backnotprop/plannotator/issues/757), and [#867](https://github.com/backnotprop/plannotator/pull/867) closing [#836](https://github.com/backnotprop/plannotator/issues/836), contributed by @ishowman\n+\n+### Additional Changes\n+\n+- **README redesign.** The project README was rebuilt around a feature table with a centered note on AI assistance and refreshed styling. [#891](https://github.com/backnotprop/plannotator/pull/891) and [#892](https://github.com/backnotprop/plannotator/pull/892)\n+\n+## Install / Update\n+\n+**macOS / Linux:**\n+\n+```bash\n+curl -fsSL https://plannotator.ai/install.sh | bash\n+```\n+\n+**Windows:**\n+\n+```powershell\n+irm https://plannotator.ai/install.ps1 | iex\n+```\n+\n+**Extra skills** (compound, setup-goal, visual-explainer), opt-in:\n+\n+```bash\n+npx skills add backnotprop/plannotator/apps/skills/extra\n+```\n+\n+**Claude Code Plugin:** Run `/plugin` in Claude Code, find **plannotator**, and click **\"Update now\"**.\n+\n+**OpenCode:** Clear cache and restart:\n+\n+```bash\n+rm -rf ~/.bun/install/cache/@plannotator\n+```\n+\n+Then in `opencode.json`:\n+\n+```json\n+{\n+  \"plugin\": [\"@plannotator/opencode@latest\"]\n+}\n+```\n+\n+**Pi:** Install or update the extension:\n+\n+```bash\n+pi install npm:@plannotator/pi-extension\n+```\n+\n+**Droid:** Install via the plugin marketplace:\n+\n+```\n+droid plugin marketplace add backnotprop/plannotator\n+droid plugin install plannotator@plannotator\n+```\n+\n+**Amp:** Install the CLI first, then copy the plugin:\n+\n+```bash\n+mkdir -p ~/.config/amp/plugins\n+curl -fsSL https://raw.githubusercontent.com/backnotprop/plannotator/main/apps/amp-plugin/plannotator.ts \\\n+  -o ~/.config/amp/plugins/plannotator.ts\n+```\n+\n+**Kiro CLI:** The installer auto-detects Kiro and installs skills automatically. After installing the CLI, launch with:\n+\n+```bash\n+kiro-cli chat --agent plannotator\n+```\n+\n+Upgrading from before v0.20.0? Read the [v0.20.0 release notes](https://github.com/backnotprop/plannotator/releases/tag/v0.20.0) first; that release changed how skills install.\n+\n+---\n+\n+## What's Changed\n+\n+- feat(review): migrate all-files code review to Pierre CodeView by @backnotprop in [#885](https://github.com/backnotprop/plannotator/pull/885)\n+- fix(markdown): keep custom angle autolinks literal by @ishowman in [#867](https://github.com/backnotprop/plannotator/pull/867)\n+- fix(annotate): improve error message for unsupported file types by @ishowman in [#870](https://github.com/backnotprop/plannotator/pull/870)\n+- refactor(agent-mode): Unify agent mode engine selection by @codythatsme in [#868](https://github.com/backnotprop/plannotator/pull/868)\n+- feat(review): large-PR pipeline, instant-open checkout, scroll perf, and worker-pool highlighting by @backnotprop in [#893](https://github.com/backnotprop/plannotator/pull/893)\n+- feat(readme): redesign README by @backnotprop in [#891](https://github.com/backnotprop/plannotator/pull/891)\n+- style(readme): center AI note under feature table by @backnotprop in [#892](https://github.com/backnotprop/plannotator/pull/892)\n+- fix(review): signal-safe cleanup + triage suffix for PR feedback by @backnotprop in [#914](https://github.com/backnotprop/plannotator/pull/914)\n+- feat(pi): add programmatic plan mode event by @Termina1 in [#898](https://github.com/backnotprop/plannotator/pull/898)\n+\n+## New Contributors\n+\n+- @ishowman made their first contribution in [#867](https://github.com/backnotprop/plannotator/pull/867)\n+- @Termina1 made their first contribution in [#898](https://github.com/backnotprop/plannotator/pull/898)\n+\n+## Contributors\n+\n+@ishowman landed two fixes in their first contributions: a clearer error from `plannotator annotate` when a file type is not supported, and a markdown fix that keeps custom angle-bracket autolinks literal instead of styling their contents. @Termina1 added the programmatic plan-mode event to the Pi extension, letting other extensions and automation enter, exit, toggle, or query plan mode and read back the resulting phase. @codythatsme unified agent mode engine selection so review and tour modes share one consistent model for choosing between Claude and Codex, with existing settings migrated forward.\n+\n+This release also resolved community-reported issues. @NikiforovAll reported the misleading \"File not found\" message from `plannotator annotate` on unsupported file types, with a concrete `.cs` reproduction. @Thraka reported the markdown autolink rendering issue, and @MannXo contributed to the discussion that shaped the fix.\n+\n+**Full Changelog**: https://github.com/backnotprop/plannotator/compare/v0.20.1...v0.20.2\ndiff --git a/RELEASE_NOTES_v0.20.3.md b/RELEASE_NOTES_v0.20.3.md\nnew file mode 100644\nindex 00000000..3ab5a148\n--- /dev/null\n+++ b/RELEASE_NOTES_v0.20.3.md\n@@ -0,0 +1,120 @@\n+Follow [@plannotator](https://x.com/plannotator) on X for updates\n+\n+---\n+\n+\u003cdetails\u003e\n+\u003csummary\u003e\u003cstrong\u003eMissed recent releases?\u003c/strong\u003e\u003c/summary\u003e\n+\n+| Release                                                                      | Highlights                                                                                                                       |\n+| ---------------------------------------------------------------------------- | -------------------------------------------------------------------------------------------------------------------------------- |\n+| [v0.20.2](https://github.com/backnotprop/plannotator/releases/tag/v0.20.2)   | Pierre CodeView all-files review, large-PR pipeline and instant-open checkout, unified agent engine selection, Pi programmatic plan mode |\n+| [v0.20.1](https://github.com/backnotprop/plannotator/releases/tag/v0.20.1)   | Pi extension install hotfix (pinned `@pierre/diffs` after a broken upstream release)                                             |\n+| [v0.20.0](https://github.com/backnotprop/plannotator/releases/tag/v0.20.0)   | Multi-repo workspace reviews, semantic diff overview, UI 2.0 themes and plan look chooser, leaner single-source skill install   |\n+| [v0.19.27](https://github.com/backnotprop/plannotator/releases/tag/v0.19.27) | Kiro CLI integration, Glimpse native window, annotate-last message picker                                                        |\n+| [v0.19.26](https://github.com/backnotprop/plannotator/releases/tag/v0.19.26) | Amp plugin production fixes, Mermaid rendering fix, Settings flicker fix, update notification toast and shimmer                   |\n+| [v0.19.24](https://github.com/backnotprop/plannotator/releases/tag/v0.19.24) | Amp integration, configurable data directory, Auto Mode permission option, Pi plan approval fix                                  |\n+| [v0.19.23](https://github.com/backnotprop/plannotator/releases/tag/v0.19.23) | Droid integration, Windows Pi AI fix, quieter update indicator                                                                   |\n+| [v0.19.22](https://github.com/backnotprop/plannotator/releases/tag/v0.19.22) | Safari copy fix in plan viewer, CLAUDE_CONFIG_DIR support for session logs                                                       |\n+| [v0.19.21](https://github.com/backnotprop/plannotator/releases/tag/v0.19.21) | Ask AI in plan review and annotate mode, shared AI runtime, origin-aware provider defaults                                       |\n+| [v0.19.20](https://github.com/backnotprop/plannotator/releases/tag/v0.19.20) | Interactive goal setup UI, OpenCode submit_plan fixes, browser no-op sentinel handling for Claude agents                         |\n+| [v0.19.18](https://github.com/backnotprop/plannotator/releases/tag/v0.19.18) | Edit-based submit_plan for OpenCode, Pi namespace migration, Codex annotate-last fix, OpenCode commands dir fix                  |\n+\n+\u003c/details\u003e\n+\n+---\n+\n+## What's New in v0.20.3\n+\n+v0.20.3 is a small patch of two PRs, both focused on the comment popover used in plan review and annotate mode. The first stops in-progress annotation text from being thrown away, and stops the annotation panel from forcing itself open. The second adds a way to find a comment box again after it scrolls out of view. Both came out of community feature requests.\n+\n+### Annotations No Longer Lost When You Click Away\n+\n+The comment popover used to close on any click outside it, which discarded whatever you had typed but not yet saved. A misplaced click meant retyping the annotation. Now a popover that holds text or an attached image stays open when you click elsewhere, so your in-progress work survives a stray click. Empty popovers still close on an outside click, and Escape and the X button still cancel explicitly, so nothing changes about how you dismiss a box you actually want to discard.\n+\n+The same release stops annotations from forcing the right annotation panel open. If you had closed the panel, adding a plan annotation or a code-file popout annotation used to reopen it and pull focus away from what you were reading. The panel now stays in whatever state you left it, and you can open it from the header toggle when you want it. The annotation itself is still selected and still shows its highlight, so it is never lost or hidden.\n+\n+- [#919](https://github.com/backnotprop/plannotator/pull/919) closing [#821](https://github.com/backnotprop/plannotator/issues/821) and [#888](https://github.com/backnotprop/plannotator/issues/888), contributed by @backnotprop\n+\n+### Off-Screen Indicator for an Open Comment\n+\n+Because an open comment box now persists when you click or scroll away, it became possible to leave one open above or below the visible area and lose track of it. When that happens, a small pill appears pinned to the top or bottom of the viewport with a chevron pointing toward the box and an \"Open comment\" label. Clicking it scrolls back to the comment. The indicator only appears for a box that has actually left the viewport and disappears as soon as it returns, so it stays out of the way the rest of the time.\n+\n+- [#920](https://github.com/backnotprop/plannotator/pull/920), contributed by @backnotprop\n+\n+## Install / Update\n+\n+**macOS / Linux:**\n+\n+```bash\n+curl -fsSL https://plannotator.ai/install.sh | bash\n+```\n+\n+**Windows:**\n+\n+```powershell\n+irm https://plannotator.ai/install.ps1 | iex\n+```\n+\n+**Extra skills** (compound, setup-goal, visual-explainer), opt-in:\n+\n+```bash\n+npx skills add backnotprop/plannotator/apps/skills/extra\n+```\n+\n+**Claude Code Plugin:** Run `/plugin` in Claude Code, find **plannotator**, and click **\"Update now\"**.\n+\n+**OpenCode:** Clear cache and restart:\n+\n+```bash\n+rm -rf ~/.bun/install/cache/@plannotator\n+```\n+\n+Then in `opencode.json`:\n+\n+```json\n+{\n+  \"plugin\": [\"@plannotator/opencode@latest\"]\n+}\n+```\n+\n+**Pi:** Install or update the extension:\n+\n+```bash\n+pi install npm:@plannotator/pi-extension\n+```\n+\n+**Droid:** Install via the plugin marketplace:\n+\n+```\n+droid plugin marketplace add backnotprop/plannotator\n+droid plugin install plannotator@plannotator\n+```\n+\n+**Amp:** Install the CLI first, then copy the plugin:\n+\n+```bash\n+mkdir -p ~/.config/amp/plugins\n+curl -fsSL https://raw.githubusercontent.com/backnotprop/plannotator/main/apps/amp-plugin/plannotator.ts \\\n+  -o ~/.config/amp/plugins/plannotator.ts\n+```\n+\n+**Kiro CLI:** The installer auto-detects Kiro and installs skills automatically. After installing the CLI, launch with:\n+\n+```bash\n+kiro-cli chat --agent plannotator\n+```\n+\n+Upgrading from before v0.20.0? Read the [v0.20.0 release notes](https://github.com/backnotprop/plannotator/releases/tag/v0.20.0) first; that release changed how skills install.\n+\n+---\n+\n+## What's Changed\n+\n+- Keep annotation panel closed when adding annotations by @backnotprop in [#919](https://github.com/backnotprop/plannotator/pull/919)\n+- feat(annotate): off-screen indicator for open comment popover by @backnotprop in [#920](https://github.com/backnotprop/plannotator/pull/920)\n+\n+## Community\n+\n+Both changes in this release answer feature requests from the community. @8bitjoey asked for the annotation input to keep its text instead of closing on an outside click ([#821](https://github.com/backnotprop/plannotator/issues/821)), and @jj-valentine asked for annotations to be saved rather than lost ([#888](https://github.com/backnotprop/plannotator/issues/888)). @SyahrulBhudiF and @gwynnnplaine joined the discussion on #821 that shaped the behavior.\n+\n+**Full Changelog**: https://github.com/backnotprop/plannotator/compare/v0.20.2...v0.20.3\ndiff --git a/RELEASE_NOTES_v0.21.0.md b/RELEASE_NOTES_v0.21.0.md\nnew file mode 100644\nindex 00000000..4701097c\n--- /dev/null\n+++ b/RELEASE_NOTES_v0.21.0.md\n@@ -0,0 +1,183 @@\n+Follow [@plannotator](https://x.com/plannotator) on X for updates\n+\n+\u003cdetails\u003e\n+\u003csummary\u003e\u003cstrong\u003eMissed recent releases?\u003c/strong\u003e\u003c/summary\u003e\n+\n+| Release                                                                      | Highlights                                                                                                                       |\n+| ---------------------------------------------------------------------------- | -------------------------------------------------------------------------------------------------------------------------------- |\n+| [v0.20.3](https://github.com/backnotprop/plannotator/releases/tag/v0.20.3)   | Annotations no longer lost when clicking away, off-screen indicator for open comments                                            |\n+| [v0.20.2](https://github.com/backnotprop/plannotator/releases/tag/v0.20.2)   | Pierre CodeView all-files review, large-PR pipeline and instant-open checkout, unified agent engine selection, Pi programmatic plan mode |\n+| [v0.20.1](https://github.com/backnotprop/plannotator/releases/tag/v0.20.1)   | Pi extension install hotfix (pinned `@pierre/diffs` after a broken upstream release)                                             |\n+| [v0.20.0](https://github.com/backnotprop/plannotator/releases/tag/v0.20.0)   | Multi-repo workspace reviews, semantic diff overview, UI 2.0 themes and plan look chooser, leaner single-source skill install   |\n+| [v0.19.27](https://github.com/backnotprop/plannotator/releases/tag/v0.19.27) | Kiro CLI integration, Glimpse native window, annotate-last message picker                                                        |\n+| [v0.19.26](https://github.com/backnotprop/plannotator/releases/tag/v0.19.26) | Amp plugin production fixes, Mermaid rendering fix, Settings flicker fix, update notification toast and shimmer                   |\n+| [v0.19.24](https://github.com/backnotprop/plannotator/releases/tag/v0.19.24) | Amp integration, configurable data directory, Auto Mode permission option, Pi plan approval fix                                  |\n+| [v0.19.23](https://github.com/backnotprop/plannotator/releases/tag/v0.19.23) | Droid integration, Windows Pi AI fix, quieter update indicator                                                                   |\n+| [v0.19.22](https://github.com/backnotprop/plannotator/releases/tag/v0.19.22) | Safari copy fix in plan viewer, CLAUDE_CONFIG_DIR support for session logs                                                       |\n+| [v0.19.21](https://github.com/backnotprop/plannotator/releases/tag/v0.19.21) | Ask AI in plan review and annotate mode, shared AI runtime, origin-aware provider defaults                                       |\n+| [v0.19.20](https://github.com/backnotprop/plannotator/releases/tag/v0.19.20) | Interactive goal setup UI, OpenCode submit_plan fixes, browser no-op sentinel handling for Claude agents                         |\n+\n+\u003c/details\u003e\n+\n+---\n+\n+## What's New in v0.21.0\n+\n+This is a large release for the annotate experience. Seventeen pull requests landed since v0.20.3, five of them from external contributors, including first contributions from four new community members. The headline is a set of features that turn annotate mode into a place where you can read, edit, run an agent, and jump into your own tools without leaving the document. Alongside that, several reliability fixes harden the paths that remote and CI users depend on.\n+\n+### Edit Documents Directly in Annotate Mode\n+\n+Until now, annotation was a one-way conversation: you highlighted text, wrote a comment, and the agent received your notes. If you wanted to change a sentence yourself, you described the change instead of making it.\n+\n+This release adds a real markdown editor to annotate and plan mode. You can switch a document into edit mode, change the text directly, and the difference between the original and your edits is captured as a clean diff that travels to the agent alongside your annotations. The edit controls were reworked so the state is always legible: a clear **Edits** label, Save emphasis when there are unsaved changes, and a Save/Cancel pair where Cancel discards your changes after a confirmation rather than silently keeping them.\n+\n+Saved source-file edits now survive a refresh. When you edit a file in annotate-folder mode and save it, the right-side Edits card is persisted in the annotation draft and restored after a reload. Restored edits are validated against the file's current contents on disk, so stale context is dropped rather than resurfaced, and the edit context is never sent to the agent if it no longer matches the file.\n+\n+PR [#890](https://github.com/backnotprop/plannotator/pull/890), [#928](https://github.com/backnotprop/plannotator/pull/928), [#936](https://github.com/backnotprop/plannotator/pull/936) by @backnotprop.\n+\n+### A Live File Tree for Annotated Folders\n+\n+When you annotate a folder, the file tree on the left is now live. It uses a server-side file watcher rather than polling, so the tree updates as files change on disk. Git status drives per-file badges and folder totals, showing which files are modified, added, or deleted, with line counts for changes. Direct source-file edits made inside Plannotator show their save state in the tree as well: clean, dirty, saving, saved, or conflict.\n+\n+Two follow-up rounds hardened this. Nested ignored folders like `node_modules` and `dist` are now pruned by path segment so the watcher never walks into them, watcher teardown is identity-safe so reconnects can't orphan old watchers, and git status reads run asynchronously with timeouts and request coalescing so a slow repository can't block the server. A startup-latency fix ensures the tree's first snapshot renders before the live watcher subscribes, so the tree no longer sits on a loading state while the watcher sets up.\n+\n+PR [#931](https://github.com/backnotprop/plannotator/pull/931), [#933](https://github.com/backnotprop/plannotator/pull/933), [#935](https://github.com/backnotprop/plannotator/pull/935) by @backnotprop.\n+\n+### An Agent Terminal Inside Annotate Mode\n+\n+Annotate mode now includes an optional agent terminal panel. You can run a coding agent in a real terminal next to the document you're annotating, so the back-and-forth happens in one place instead of a separate window.\n+\n+The terminal is backed by a PTY hosted in a small Node sidecar, since the compiled Plannotator runtime can't load native terminal bindings directly. On a normal install the runtime is provisioned automatically, and where it isn't available the panel disables itself cleanly rather than failing the session. Requires Node.js 20 or newer on your PATH.\n+\n+PR [#941](https://github.com/backnotprop/plannotator/pull/941) by @backnotprop.\n+\n+### Open Files in Your Editor, Terminal, or File Manager\n+\n+A new \"open in\" control lets you launch the file you're looking at directly in an external application: VS Code, Cursor, Zed, Ghostty, iTerm2, Warp, Sublime Text, Xcode, Android Studio, or reveal it in Finder or Explorer. Only applications you actually have installed appear in the menu, the last one you used becomes the default, and copy-path and copy-diff actions are always available. The control hides itself in remote sessions where opening a local app wouldn't make sense.\n+\n+This release also includes a pass on the code-review UI. The semantic diff moved from a separate docked panel into an inline accordion in the all-files view, file headers and the file tree were reworked, and the diff-freshness check was tidied.\n+\n+PR [#942](https://github.com/backnotprop/plannotator/pull/942) by @backnotprop.\n+\n+### HTML Files Render as HTML\n+\n+Annotating an `.html` file now renders the page as HTML by default instead of converting it to markdown. For most HTML — rendered reports, exported documents, generated pages — this is what you actually want to look at. If you need the old behavior, pass `--markdown` to convert the page to text with Turndown. The serving path for raw HTML and its assets was also hardened against symlink escapes.\n+\n+This is a behavior change for anyone who ran `plannotator annotate file.html` expecting a markdown view. The conversion is one flag away.\n+\n+PR [#924](https://github.com/backnotprop/plannotator/pull/924), [#927](https://github.com/backnotprop/plannotator/pull/927) by @backnotprop.\n+\n+### Additional Changes\n+\n+- **Remote sessions always show a reachable URL.** The session URL is now printed to the terminal for remote sessions regardless of whether URL sharing is enabled, and local sessions print the URL as a fallback when the browser can't be opened (a headless box or devcontainer). This closes a long-standing gap where remote and headless users could be left with no link and a hung review. PR [#929](https://github.com/backnotprop/plannotator/pull/929), [#945](https://github.com/backnotprop/plannotator/pull/945) by @backnotprop.\n+- **Ask AI works on Bedrock and Vertex.** Bare model aliases were being rejected with a 400 on Amazon Bedrock and Google Vertex; model ids are now resolved to the correct provider-specific identifiers, with a safe fallback when none is configured. PR [#939](https://github.com/backnotprop/plannotator/pull/939) closing [#938](https://github.com/backnotprop/plannotator/issues/938) by @masterpavan.\n+- **Release binaries ignore caller `bunfig.toml`.** Compiled binaries no longer autoload a `bunfig.toml` from the directory they're run in, so a stray or hostile config in a project folder can't alter or crash the binary. PR [#937](https://github.com/backnotprop/plannotator/pull/937) by @jrpat.\n+- **Light-mode contrast fix in code hover previews.** Code hover previews used a dark-mode color in light mode, making text hard to read. PR [#934](https://github.com/backnotprop/plannotator/pull/934) by @hl662.\n+- **Turn URL sharing off via config.** URL sharing can now be disabled through `~/.plannotator/config.json` (`{ \"share\": \"disabled\" }`) in addition to the environment variable. PR [#921](https://github.com/backnotprop/plannotator/pull/921) by @yonihorn.\n+- **Save to Obsidian works from annotate sessions.** The annotate server was missing the `/api/save-notes` endpoint, so the \"Save to Obsidian\" button silently failed; the endpoint is now wired in. PR [#884](https://github.com/backnotprop/plannotator/pull/884) closing [#844](https://github.com/backnotprop/plannotator/issues/844) by @titosemi.\n+\n+## Install / Update\n+\n+**macOS / Linux:**\n+\n+```bash\n+curl -fsSL https://plannotator.ai/install.sh | bash\n+```\n+\n+**Windows:**\n+\n+```powershell\n+irm https://plannotator.ai/install.ps1 | iex\n+```\n+\n+**Extra skills** (compound, setup-goal, visual-explainer), opt-in:\n+\n+```bash\n+npx skills add backnotprop/plannotator/apps/skills/extra\n+```\n+\n+**Claude Code Plugin:** Run `/plugin` in Claude Code, find **plannotator**, and click **\"Update now\"**.\n+\n+**OpenCode:** Clear cache and restart:\n+\n+```bash\n+rm -rf ~/.bun/install/cache/@plannotator\n+```\n+\n+Then in `opencode.json`:\n+\n+```json\n+{\n+  \"plugin\": [\"@plannotator/opencode@latest\"]\n+}\n+```\n+\n+**Pi:** Install or update the extension:\n+\n+```bash\n+pi install npm:@plannotator/pi-extension\n+```\n+\n+**Droid:** Install via the plugin marketplace:\n+\n+```\n+droid plugin marketplace add backnotprop/plannotator\n+droid plugin install plannotator@plannotator\n+```\n+\n+**Amp:** Install the CLI first, then copy the plugin:\n+\n+```bash\n+mkdir -p ~/.config/amp/plugins\n+curl -fsSL https://raw.githubusercontent.com/backnotprop/plannotator/main/apps/amp-plugin/plannotator.ts \\\n+  -o ~/.config/amp/plugins/plannotator.ts\n+```\n+\n+**Kiro CLI:** The installer auto-detects Kiro and installs skills automatically. After installing the CLI, launch with:\n+\n+```bash\n+kiro-cli chat --agent plannotator\n+```\n+\n+Upgrading from before v0.20.0? Read the [v0.20.0 release notes](https://github.com/backnotprop/plannotator/releases/tag/v0.20.0) first; that release changed how skills install.\n+\n+---\n+\n+## What's Changed\n+\n+- feat(editor): markdown edit mode — direct document editing with diff-to-agent feedback by @backnotprop in [#890](https://github.com/backnotprop/plannotator/pull/890)\n+- feat(config): support share toggle via config.json by @yonihorn in [#921](https://github.com/backnotprop/plannotator/pull/921)\n+- feat(annotate): render HTML annotations as HTML by default by @backnotprop in [#924](https://github.com/backnotprop/plannotator/pull/924)\n+- fix(annotate): block symlink escape in HTML asset serving by @backnotprop in [#927](https://github.com/backnotprop/plannotator/pull/927)\n+- fix(annotate): add /api/save-notes POST endpoint to annotate server by @titosemi in [#884](https://github.com/backnotprop/plannotator/pull/884)\n+- feat(editor): clearer edit controls — Edits label, Save emphasis, Save/Cancel by @backnotprop in [#928](https://github.com/backnotprop/plannotator/pull/928)\n+- fix(server): always show remote URL + close share-html symlink gap by @backnotprop in [#929](https://github.com/backnotprop/plannotator/pull/929)\n+- feat(annotate): live file tree workspace status by @backnotprop in [#931](https://github.com/backnotprop/plannotator/pull/931)\n+- fix(annotate): polish live file tree refresh by @backnotprop in [#933](https://github.com/backnotprop/plannotator/pull/933)\n+- feat(annotate): persist saved file edits in drafts by @backnotprop in [#936](https://github.com/backnotprop/plannotator/pull/936)\n+- fix(ai): resolve Bedrock/Vertex model ids for Ask AI by @masterpavan in [#939](https://github.com/backnotprop/plannotator/pull/939)\n+- chore(release): disable bunfig autoload for release binaries by @jrpat in [#937](https://github.com/backnotprop/plannotator/pull/937)\n+- fix(ui): correct light-mode contrast in code hover preview by @hl662 in [#934](https://github.com/backnotprop/plannotator/pull/934)\n+- fix(annotate): live file tree startup latency by @backnotprop in [#935](https://github.com/backnotprop/plannotator/pull/935)\n+- feat(annotate): open files in external apps + code-review UX pass by @backnotprop in [#942](https://github.com/backnotprop/plannotator/pull/942)\n+- feat(annotate): WebTUI agent panel in annotate mode by @backnotprop in [#941](https://github.com/backnotprop/plannotator/pull/941)\n+- fix(server): surface session URL in local mode when the browser can't open by @backnotprop in [#945](https://github.com/backnotprop/plannotator/pull/945)\n+\n+## New Contributors\n+\n+- @titosemi made their first contribution in [#884](https://github.com/backnotprop/plannotator/pull/884)\n+- @hl662 made their first contribution in [#934](https://github.com/backnotprop/plannotator/pull/934)\n+- @jrpat made their first contribution in [#937](https://github.com/backnotprop/plannotator/pull/937)\n+- @masterpavan made their first contribution in [#939](https://github.com/backnotprop/plannotator/pull/939)\n+\n+## Contributors\n+\n+Thanks to the five external contributors in this release.\n+\n+@titosemi fixed a bug that several people had run into: the \"Save to Obsidian\" button silently failing from annotate sessions, because the annotate server was missing the `/api/save-notes` endpoint. @masterpavan reported and fixed Ask AI's failure on Amazon Bedrock and Google Vertex, where bare model aliases were being rejected with a 400. @jrpat hardened the release binaries so they no longer autoload a `bunfig.toml` from the caller's directory, closing a path where a stray config could crash a compiled binary. @hl662 fixed a light-mode contrast bug that made code hover previews hard to read. @yonihorn, back for a fourth contribution, added a config-file switch to disable URL sharing.\n+\n+Thanks also to the community members whose reports shaped this release:\n+\n+- @rrpolanco for reporting the Obsidian save failure in [#844](https://github.com/backnotprop/plannotator/issues/844)\n+\n+**Full Changelog**: https://github.com/backnotprop/plannotator/compare/v0.20.3...v0.21.0\ndiff --git a/RELEASE_NOTES_v0.21.1.md b/RELEASE_NOTES_v0.21.1.md\nnew file mode 100644\nindex 00000000..b142c6d3\n--- /dev/null\n+++ b/RELEASE_NOTES_v0.21.1.md\n@@ -0,0 +1,111 @@\n+Follow [@plannotator](https://x.com/plannotator) on X for updates\n+\n+\u003cdetails\u003e\n+\u003csummary\u003e\u003cstrong\u003eMissed recent releases?\u003c/strong\u003e\u003c/summary\u003e\n+\n+| Release                                                                      | Highlights                                                                                                                       |\n+| ---------------------------------------------------------------------------- | -------------------------------------------------------------------------------------------------------------------------------- |\n+| [v0.21.0](https://github.com/backnotprop/plannotator/releases/tag/v0.21.0)   | Direct document editing in annotate mode, live git-status file tree, in-app agent terminal, open files in external apps, HTML renders as HTML |\n+| [v0.20.3](https://github.com/backnotprop/plannotator/releases/tag/v0.20.3)   | Annotations no longer lost when clicking away, off-screen indicator for open comments                                            |\n+| [v0.20.2](https://github.com/backnotprop/plannotator/releases/tag/v0.20.2)   | Pierre CodeView all-files review, large-PR pipeline and instant-open checkout, unified agent engine selection, Pi programmatic plan mode |\n+| [v0.20.1](https://github.com/backnotprop/plannotator/releases/tag/v0.20.1)   | Pi extension install hotfix (pinned `@pierre/diffs` after a broken upstream release)                                             |\n+| [v0.20.0](https://github.com/backnotprop/plannotator/releases/tag/v0.20.0)   | Multi-repo workspace reviews, semantic diff overview, UI 2.0 themes and plan look chooser, leaner single-source skill install   |\n+| [v0.19.27](https://github.com/backnotprop/plannotator/releases/tag/v0.19.27) | Kiro CLI integration, Glimpse native window, annotate-last message picker                                                        |\n+| [v0.19.26](https://github.com/backnotprop/plannotator/releases/tag/v0.19.26) | Amp plugin production fixes, Mermaid rendering fix, Settings flicker fix, update notification toast and shimmer                   |\n+| [v0.19.24](https://github.com/backnotprop/plannotator/releases/tag/v0.19.24) | Amp integration, configurable data directory, Auto Mode permission option, Pi plan approval fix                                  |\n+| [v0.19.23](https://github.com/backnotprop/plannotator/releases/tag/v0.19.23) | Droid integration, Windows Pi AI fix, quieter update indicator                                                                   |\n+| [v0.19.22](https://github.com/backnotprop/plannotator/releases/tag/v0.19.22) | Safari copy fix in plan viewer, CLAUDE_CONFIG_DIR support for session logs                                                       |\n+| [v0.19.21](https://github.com/backnotprop/plannotator/releases/tag/v0.19.21) | Ask AI in plan review and annotate mode, shared AI runtime, origin-aware provider defaults                                       |\n+\n+\u003c/details\u003e\n+\n+---\n+\n+## What's New in v0.21.1\n+\n+A single-fix patch release. Annotating the last assistant message could open a blank page in any conversation with more than one response. This release fixes that.\n+\n+### Annotate-Last No Longer Blanks on Multi-Message Sessions\n+\n+Running `/plannotator-last` (or `plannotator last`) opened a blank page whenever the session had two or more recent assistant messages. With zero or one message it worked, so it looked intermittent, but it was deterministic: the failure tracked message count. It was most visible on the Pi extension, where multi-turn sessions are the norm.\n+\n+The cause was a React rendering bug. When the annotate UI assembled the feedback payload during render, it reached a helper that wrote component state as a side effect. Because that state was a freshly built map on each pass, React never settled, hit its re-render limit, and threw before drawing anything, leaving an empty page. The fix makes that render-path helper a pure read of the same data, so the work that belongs at submit time no longer fires during render. The exported feedback is unchanged; the page renders.\n+\n+PR [#950](https://github.com/backnotprop/plannotator/pull/950) closing [#949](https://github.com/backnotprop/plannotator/issues/949), reported, diagnosed, and fixed by @emmaneugene.\n+\n+## Install / Update\n+\n+**macOS / Linux:**\n+\n+```bash\n+curl -fsSL https://plannotator.ai/install.sh | bash\n+```\n+\n+**Windows:**\n+\n+```powershell\n+irm https://plannotator.ai/install.ps1 | iex\n+```\n+\n+**Extra skills** (compound, setup-goal, visual-explainer), opt-in:\n+\n+```bash\n+npx skills add backnotprop/plannotator/apps/skills/extra\n+```\n+\n+**Claude Code Plugin:** Run `/plugin` in Claude Code, find **plannotator**, and click **\"Update now\"**.\n+\n+**OpenCode:** Clear cache and restart:\n+\n+```bash\n+rm -rf ~/.bun/install/cache/@plannotator\n+```\n+\n+Then in `opencode.json`:\n+\n+```json\n+{\n+  \"plugin\": [\"@plannotator/opencode@latest\"]\n+}\n+```\n+\n+**Pi:** Install or update the extension:\n+\n+```bash\n+pi install npm:@plannotator/pi-extension\n+```\n+\n+**Droid:** Install via the plugin marketplace:\n+\n+```\n+droid plugin marketplace add backnotprop/plannotator\n+droid plugin install plannotator@plannotator\n+```\n+\n+**Amp:** Install the CLI first, then copy the plugin:\n+\n+```bash\n+mkdir -p ~/.config/amp/plugins\n+curl -fsSL https://raw.githubusercontent.com/backnotprop/plannotator/main/apps/amp-plugin/plannotator.ts \\\n+  -o ~/.config/amp/plugins/plannotator.ts\n+```\n+\n+**Kiro CLI:** The installer auto-detects Kiro and installs skills automatically. After installing the CLI, launch with:\n+\n+```bash\n+kiro-cli chat --agent plannotator\n+```\n+\n+Upgrading from before v0.20.0? Read the [v0.20.0 release notes](https://github.com/backnotprop/plannotator/releases/tag/v0.20.0) first; that release changed how skills install.\n+\n+---\n+\n
